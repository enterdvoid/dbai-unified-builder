# Temporary smoke-build trigger; remove after the exact regression scenario finishes.
name: DBAI Unified Firmware Builder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dbai-build.yml"
  workflow_dispatch:
    inputs:
      board:
        description: "Board target; choose custom to enter an exact board ID below"
        type: choice
        required: true
        default: aml-s9xx-box
        options:
          - aml-s9xx-box
          - orangepi5-plus
          - orangepi5
          - orangepi3-lts
          - odroidn2
          - odroidm1
          - odroidc4
          - khadas-vim4
          - nanopi-r4s
          - bananapim5
          - rock-5b
          - custom
      custom_board_name:
        description: "Only used when board=custom; exact ID from config/boards/<ID>.*"
        type: string
        required: false
        default: ""
      source_ref:
        description: "Armbian source branch/tag/commit (use a commit SHA for reproducibility)"
        type: string
        required: true
        default: main
      releases:
        description: "Comma-separated Debian releases: bullseye,bookworm,trixie,forky"
        type: string
        required: true
        default: "bookworm,trixie"
      profiles:
        description: "Comma-separated profiles: minimal,server,application,desktop"
        type: string
        required: true
        default: "minimal,server,application,desktop"
      filesystem:
        description: "Build ext4, btrfs, or both variants"
        type: choice
        required: true
        default: both
        options:
          - both
          - ext4
          - btrfs
      app_profile:
        description: "Applied only to the application image profile"
        type: choice
        required: true
        default: casaos
        options:
          - none
          - homeassistant
          - openmediavault
          - casaos
          - hermes-9router
          - lightnvr-go2rtc
          - hermes-9router-lightnvr
      kernel_mode:
        description: "Kernel source/build strategy"
        type: choice
        required: true
        default: Kernel Official
        options:
          - Kernel Official
          - Recompile Kernel Official
          - Custom Kernel
          - Recompile Custom Kernel
      custom_kernel_bundle_url:
        description: "Custom Kernel only: HTTPS URL to one .tar.gz or .tar.xz bundle containing boot-<version>.tar.gz, dtb-amlogic-<version>.tar.gz, header-<version>.tar.gz, and modules-<version>.tar.gz"
        type: string
        required: false
        default: ""
      custom_kernel_repo_url:
        description: "Recompile Custom Kernel only: public HTTPS Git URL of the kernel source repository"
        type: string
        required: false
        default: ""
      custom_kernel_repo_ref:
        description: "Branch or tag to compile from in the custom kernel repository (use tag:<name> for tags)"
        type: string
        required: false
        default: main
      kernel_patch_series:
        description: "Patch directory under kernel-patches/; for aml-s9xx-box use meson64-current"
        type: string
        required: false
        default: meson64-current
      proxmox_mode:
        description: "Add separate Proxmox profile jobs: official=Trixie, community=Bookworm, both=both releases"
        type: choice
        required: true
        default: none
        options:
          - none
          - official
          - community
          - both

permissions:
  contents: read

concurrency:
  group: dbai-builder-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dbai-smoke]') }}
    name: Validate inputs and expand build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      board: ${{ steps.matrix.outputs.board }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs and create matrix
        id: matrix
        shell: bash
        env:
          BOARD_INPUT: ${{ inputs.board || 'aml-s9xx-box' }}
          CUSTOM_BOARD: ${{ inputs.custom_board_name || '' }}
          RELEASES_INPUT: ${{ inputs.releases || 'trixie' }}
          PROFILES_INPUT: ${{ inputs.profiles || 'minimal,server,application,desktop' }}
          FILESYSTEM_INPUT: ${{ inputs.filesystem || 'ext4' }}
          KERNEL_MODE: ${{ inputs.kernel_mode || 'Kernel Official' }}
          APP_PROFILE: ${{ inputs.app_profile || 'none' }}
          CUSTOM_KERNEL_BUNDLE_URL: ${{ inputs.custom_kernel_bundle_url || '' }}
          CUSTOM_KERNEL_REPO_URL: ${{ inputs.custom_kernel_repo_url || '' }}
          CUSTOM_KERNEL_REPO_REF: ${{ inputs.custom_kernel_repo_ref || 'main' }}
          KERNEL_PATCH_SERIES: ${{ inputs.kernel_patch_series || 'meson64-current' }}
          PROXMOX_MODE: ${{ inputs.proxmox_mode || 'official' }}
          RELEASE_TOKEN_PRESENT: ${{ secrets.DBAI_RELEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TOKEN_PRESENT" != "true" ]]; then
            echo "::error::Missing repository secret DBAI_RELEASE_TOKEN. Add it before starting a firmware batch to avoid wasting build time."
            exit 2
          fi
          BOARD="$BOARD_INPUT"
          if [[ "$BOARD" == "custom" ]]; then
            BOARD="$CUSTOM_BOARD"
          fi
          bash scripts/validate-inputs.sh "$BOARD" "" "$RELEASES_INPUT" "$PROFILES_INPUT" "$FILESYSTEM_INPUT" "$KERNEL_MODE" "$APP_PROFILE" "$PROXMOX_MODE"

          if [[ "$KERNEL_MODE" == "Custom Kernel" ]]; then
            [[ "$CUSTOM_KERNEL_BUNDLE_URL" =~ ^https:// ]] || { echo "::error::Custom Kernel requires one HTTPS URL to a .tar.gz/.tar.xz bundle."; exit 2; }
            temp_dir="$(mktemp -d)"
            curl --fail --location --silent --show-error --retry 3 "$CUSTOM_KERNEL_BUNDLE_URL" --output "$temp_dir/kernel-bundle.tar"
            tar -tf "$temp_dir/kernel-bundle.tar" >/dev/null || { echo "::error::Custom kernel bundle is not a valid tar archive"; exit 2; }
            if ! tar -tf "$temp_dir/kernel-bundle.tar" | awk ' /^\// { bad=1 } /(^|\/)\.\.(\/|$)/ { bad=1 } END { exit bad }'; then
              echo "::error::Unsafe path in custom kernel bundle"; exit 2
            fi
            mkdir "$temp_dir/unpacked"
            tar -xf "$temp_dir/kernel-bundle.tar" -C "$temp_dir/unpacked"
            for spec in "boot:boot-" "dtb:dtb-amlogic-" "headers:header-" "modules:modules-"; do
              label="${spec%%:*}"; prefix="${spec#*:}"
              mapfile -t matches < <(find "$temp_dir/unpacked" -type f \( -name "${prefix}*.tar.gz" -o -name "${prefix}*.tar.xz" \))
              [[ "${#matches[@]}" -eq 1 ]] || { echo "::error::Bundle must contain exactly one ${prefix}*.tar.gz or .tar.xz archive"; exit 2; }
              cp "${matches[0]}" "$temp_dir/$label.tar"
              tar -tf "$temp_dir/$label.tar" >/dev/null || { echo "::error::Inner $label archive is invalid"; exit 2; }
              if ! tar -tf "$temp_dir/$label.tar" | awk ' /^\// { bad=1 } /(^|\/)\.\.(\/|$)/ { bad=1 } END { exit bad }'; then
                echo "::error::Unsafe path in inner $label archive"; exit 2
              fi
            done
            tar -tf "$temp_dir/boot.tar" | grep -Eq '^boot/' || { echo "::error::Boot archive needs paths under boot/"; exit 2; }
            tar -tf "$temp_dir/dtb.tar" | grep -Eq '^boot/.*\.dtb$' || { echo "::error::DTB archive needs .dtb files under boot/"; exit 2; }
            tar -tf "$temp_dir/modules.tar" | grep -Eq '^lib/modules/[^/]+/' || { echo "::error::Modules archive needs lib/modules/<release>/"; exit 2; }
            tar -tf "$temp_dir/headers.tar" | grep -Eq '^(usr/src/|lib/modules/[^/]+/build)' || { echo "::error::Headers archive needs usr/src/ or matching modules build paths"; exit 2; }
            rm -rf "$temp_dir"
          elif [[ "$KERNEL_MODE" == "Recompile Custom Kernel" ]]; then
            [[ "$CUSTOM_KERNEL_REPO_URL" =~ ^https:// ]] || { echo "::error::Recompile Custom Kernel requires a public HTTPS Git repository URL."; exit 2; }
            [[ "$CUSTOM_KERNEL_REPO_REF" =~ ^(branch:|tag:)?[A-Za-z0-9._/-]+$ ]] || { echo "::error::Custom kernel repo ref must be a branch name or tag (optionally prefixed with branch: or tag:)."; exit 2; }
          fi

          IFS=',' read -r -a releases <<< "$RELEASES_INPUT"
          IFS=',' read -r -a profiles <<< "$PROFILES_INPUT"
          filesystems=()
          case "$FILESYSTEM_INPUT" in
            both) filesystems=(ext4 btrfs) ;;
            ext4|btrfs) filesystems=("$FILESYSTEM_INPUT") ;;
          esac

          matrix='{"include":[]}'
          has_bookworm=false
          has_trixie=false
          for release in "${releases[@]}"; do
            release="$(xargs <<< "$release")"
            if [[ "$release" == "bookworm" ]]; then has_bookworm=true; fi
            if [[ "$release" == "trixie" ]]; then has_trixie=true; fi
            for profile in "${profiles[@]}"; do
              profile="$(xargs <<< "$profile")"
              for fs in "${filesystems[@]}"; do
                matrix="$(jq -c --arg release "$release" --arg profile "$profile" --arg filesystem "$fs" '.include += [{release:$release,profile:$profile,filesystem:$filesystem,proxmox_variant:"none"}]' <<< "$matrix")"
              done
            done
          done

          # Proxmox images are separate profile jobs, not application variants.
          if [[ "$PROXMOX_MODE" == "official" || "$PROXMOX_MODE" == "both" ]]; then
            [[ "$has_trixie" == "true" ]] || { echo "::error::Official Proxmox mode needs trixie in releases"; exit 2; }
            for fs in "${filesystems[@]}"; do
              matrix="$(jq -c --arg filesystem "$fs" '.include += [{release:"trixie",profile:"proxmox",filesystem:$filesystem,proxmox_variant:"official"}]' <<< "$matrix")"
            done
          fi
          if [[ "$PROXMOX_MODE" == "community" || "$PROXMOX_MODE" == "both" ]]; then
            [[ "$has_bookworm" == "true" ]] || { echo "::error::Community Proxmox mode needs bookworm in releases"; exit 2; }
            for fs in "${filesystems[@]}"; do
              matrix="$(jq -c --arg filesystem "$fs" '.include += [{release:"bookworm",profile:"proxmox",filesystem:$filesystem,proxmox_variant:"community"}]' <<< "$matrix")"
            done
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "board=$BOARD" >> "$GITHUB_OUTPUT"
          echo "Resolved board: $BOARD"
          echo "Planned combinations: $(jq '.include | length' <<< "$matrix")"
          jq . <<< "$matrix"

  build:
    name: ${{ matrix.release }} / ${{ matrix.profile }} / ${{ matrix.proxmox_variant }} / ${{ matrix.filesystem }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BOARD: ${{ needs.plan.outputs.board }}
      RELEASE: ${{ matrix.release }}
      PROFILE: ${{ matrix.profile }}
      FILESYSTEM: ${{ matrix.filesystem }}
      SOURCE_REF: ${{ inputs.source_ref || 'main' }}
      KERNEL_MODE: ${{ inputs.kernel_mode || 'Kernel Official' }}
      APP_PROFILE: ${{ inputs.app_profile || 'none' }}
      PROXMOX_MODE: ${{ inputs.proxmox_mode || 'official' }}
      PROXMOX_VARIANT: ${{ matrix.proxmox_variant }}
      CUSTOM_KERNEL_BUNDLE_URL: ${{ inputs.custom_kernel_bundle_url || '' }}
      CUSTOM_KERNEL_REPO_URL: ${{ inputs.custom_kernel_repo_url || '' }}
      CUSTOM_KERNEL_REPO_REF: ${{ inputs.custom_kernel_repo_ref || 'main' }}
      KERNEL_PATCH_SERIES: ${{ inputs.kernel_patch_series || 'meson64-current' }}
    steps:
      - name: Report runner resources before disk setup
        shell: bash
        run: |
          echo "Runner: $(uname -a)"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "=== Filesystems before disk setup ==="
          df -hT / /mnt "$GITHUB_WORKSPACE" || true
          lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS || true
          echo "=== Memory and swap ==="
          free -h
          swapon --show || true

      - name: Maximize available build disk
        uses: easimon/maximize-build-space@v10
        timeout-minutes: 10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Move Docker storage to large build volume
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker_root="$GITHUB_WORKSPACE/.docker-data"
          exclude_file="$GITHUB_WORKSPACE/.git/info/exclude"
          grep -qxF '/.docker-data/' "$exclude_file" || printf '\n/.docker-data/\n' >> "$exclude_file"
          sudo systemctl stop docker.socket docker.service || true
          sudo mkdir -p "$docker_root"
          sudo chown root:root "$docker_root"
          sudo python3 - "$docker_root" <<'PY'
          import json, os, sys
          path = "/etc/docker/daemon.json"
          try:
              with open(path, encoding="utf-8") as f:
                  config = json.load(f)
          except FileNotFoundError:
              config = {}
          config["data-root"] = sys.argv[1]
          tmp = path + ".tmp"
          with open(tmp, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          os.replace(tmp, path)
          PY
          sudo systemctl start docker
          for _ in {1..30}; do
            if docker info >/dev/null 2>&1; then break; fi
            sleep 2
          done
          actual_root="$(docker info --format '{{.DockerRootDir}}')"
          echo "DockerRootDir=$actual_root"
          [[ "$actual_root" == "$docker_root" ]] || { echo "::error::Docker did not switch to the large workspace volume."; exit 1; }
          df -h "$docker_root" "$GITHUB_WORKSPACE"
          available_gb="$(df -BG --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -dc '0-9')"
          (( available_gb >= 35 )) || { echo "::error::Only ${available_gb} GB free in build workspace; at least 35 GB is required."; exit 1; }

      - name: Register ARM64 QEMU binfmt on runner host
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Armbian builds ARM root filesystems inside Docker. Register QEMU on
          # the runner host first; enabling binfmt only inside the build container
          # fails because that container cannot update the host kernel registry.
          docker run --privileged --rm tonistiigi/binfmt:latest --install arm64
          if ! sudo test -r /proc/sys/fs/binfmt_misc/qemu-aarch64; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc || true
          fi
          if ! sudo test -r /proc/sys/fs/binfmt_misc/qemu-aarch64; then
            echo "::error::QEMU ARM64 binfmt registration did not create qemu-aarch64 on the runner host."
            exit 1
          fi
          sudo cat /proc/sys/fs/binfmt_misc/qemu-aarch64
          sudo grep -q '^enabled' /proc/sys/fs/binfmt_misc/qemu-aarch64 || {
            echo "::error::QEMU ARM64 binfmt exists but is not enabled."
            exit 1
          }

      - name: Resolve source and verify board ID
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BOARD" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid board ID"; exit 2; }
          # SOURCE_REF is supplied by the job-level environment.
          # shellcheck disable=SC2153
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::source_ref contains unsupported characters"; exit 2; }

          if [[ "$BOARD" == "aml-s9xx-box" ]]; then
            SOURCE_REPO="enterdvoid/build"
          else
            SOURCE_REPO="armbian/build"
          fi

          clone_source() {
            local repo="$1"
            rm -rf armbian-source
            git clone --filter=blob:none --no-checkout "https://github.com/$repo.git" armbian-source
            git -C armbian-source fetch --depth=1 origin "$SOURCE_REF"
            git -C armbian-source checkout --detach FETCH_HEAD
          }

          clone_source "$SOURCE_REPO"
          if ! find armbian-source/config/boards -maxdepth 1 -type f -name "$BOARD.*" -print -quit | grep -q .; then
            if [[ "$BOARD" != "aml-s9xx-box" && "$SOURCE_REPO" == "armbian/build" ]]; then
              echo "Board not found upstream; trying DBAI fork."
              SOURCE_REPO="enterdvoid/build"
              clone_source "$SOURCE_REPO"
            fi
          fi
          if ! find armbian-source/config/boards -maxdepth 1 -type f -name "$BOARD.*" -print -quit | grep -q .; then
            echo "::error::Board '$BOARD' was not found as config/boards/$BOARD.* in source $SOURCE_REPO at ref $SOURCE_REF."
            echo "Check the exact board ID and source ref. Custom input is not a promise of support by either source."
            exit 2
          fi

          SOURCE_SHA="$(git -C armbian-source rev-parse HEAD)"
          {
            echo "repo=$SOURCE_REPO"
            echo "sha=$SOURCE_SHA"
            echo "source_ref=$SOURCE_REF"
          } >> "$GITHUB_OUTPUT"
          echo "Using $SOURCE_REPO@$SOURCE_SHA for $BOARD"

      - name: Add DBAI build extensions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p armbian-source/userpatches/extensions
          cp extensions/dbai-casaos.sh armbian-source/userpatches/extensions/
          cp extensions/dbai-apps.sh armbian-source/userpatches/extensions/
          cp extensions/dbai-custom-kernel.sh armbian-source/userpatches/extensions/
          mkdir -p "armbian-source/userpatches/kernel/archive/$KERNEL_PATCH_SERIES"
          shopt -s nullglob
          patch_files=("$GITHUB_WORKSPACE/kernel-patches/$KERNEL_PATCH_SERIES"/*.patch)
          if (("${#patch_files[@]}" > 0)); then
            cp "${patch_files[@]}" "armbian-source/userpatches/kernel/archive/$KERNEL_PATCH_SERIES/"
            echo "Installed ${#patch_files[@]} kernel patch(es) from kernel-patches/$KERNEL_PATCH_SERIES"
          else
            echo "No optional kernel patches found in kernel-patches/$KERNEL_PATCH_SERIES"
          fi
          mkdir -p armbian-source/extensions armbian-source/tools
          cp extensions/proxmox-official.sh armbian-source/extensions/
          cp extensions/proxmox-community.sh armbian-source/extensions/
          cp tools/dbai-vm-import armbian-source/tools/

      - name: Build firmware image
        shell: bash
        env:
          SOURCE_REPO: ${{ steps.source.outputs.repo }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          cd armbian-source

          BUILD_MINIMAL=no
          BUILD_DESKTOP=no
          IMAGE_SIZE=4096
          case "$PROFILE" in
            minimal) BUILD_MINIMAL=yes; IMAGE_SIZE=4096 ;;
            server) BUILD_MINIMAL=no; IMAGE_SIZE=4096 ;;
            application) BUILD_MINIMAL=no; IMAGE_SIZE=8192 ;;
            proxmox) BUILD_MINIMAL=no; IMAGE_SIZE=8192 ;;
            desktop) BUILD_MINIMAL=no; BUILD_DESKTOP=yes; IMAGE_SIZE=8192 ;;
            *) echo "::error::Unknown profile $PROFILE"; exit 2 ;;
          esac

          EXTENSIONS=()
          PROXMOX_VARIANT="${PROXMOX_VARIANT:-none}"
          BUILD_KERNEL_MODE="$KERNEL_MODE"
          APP_PROFILE_EFFECTIVE="$APP_PROFILE"
          ARTIFACT_IGNORE_CACHE=no
          if [[ "$BUILD_KERNEL_MODE" == "Recompile Kernel Official" || "$BUILD_KERNEL_MODE" == "Recompile Custom Kernel" ]]; then
            # Bypass Armbian local/remote artifact caches and rebuild artifacts from source.
            ARTIFACT_IGNORE_CACHE=yes
          fi

          if [[ "$PROFILE" == "proxmox" ]]; then
            APP_PROFILE_EFFECTIVE=none
            BUILD_KERNEL_MODE="Kernel Official"
            ARTIFACT_IGNORE_CACHE=no
            case "$PROXMOX_VARIANT" in
              official) EXTENSIONS+=(proxmox-official) ;;
              community) EXTENSIONS+=(proxmox-community) ;;
              *) echo "::error::Missing or invalid Proxmox variant: $PROXMOX_VARIANT"; exit 2 ;;
            esac
            BSPFREEZE_ARG=(BSPFREEZE=yes)
          else
            BSPFREEZE_ARG=()
            if [[ "$PROFILE" == "application" ]]; then
              case "$APP_PROFILE" in
                homeassistant)
                  [[ "$RELEASE" =~ ^(bullseye|bookworm|trixie)$ ]] || { echo "::error::Home Assistant extension does not support $RELEASE"; exit 2; }
                  EXTENSIONS+=(applications-ha)
                  ;;
                openmediavault)
                  [[ "$RELEASE" =~ ^(bookworm|trixie)$ ]] || { echo "::error::OpenMediaVault extension only supports bookworm/trixie"; exit 2; }
                  EXTENSIONS+=(applications-omv)
                  ;;
                casaos) EXTENSIONS+=(dbai-casaos) ;;
                hermes-9router|lightnvr-go2rtc|hermes-9router-lightnvr) EXTENSIONS+=(dbai-apps) ;;
                none) : ;; # Generic application image; no additional application extension.
                *) echo "::error::Unsupported app profile $APP_PROFILE"; exit 2 ;;
              esac
            fi
          fi

          KERNELSOURCE_ARG=()
          KERNELBRANCH_ARG=()
          if [[ "$BUILD_KERNEL_MODE" == "Custom Kernel" ]]; then
            export DBAI_KERNEL_BUNDLE_URL="$CUSTOM_KERNEL_BUNDLE_URL"
            EXTENSIONS+=(dbai-custom-kernel)
            export DBAI_KERNEL_MODE="Custom Kernel"
          elif [[ "$BUILD_KERNEL_MODE" == "Recompile Custom Kernel" ]]; then
            KERNELSOURCE_ARG=("KERNELSOURCE=$CUSTOM_KERNEL_REPO_URL")
            if [[ "$CUSTOM_KERNEL_REPO_REF" == branch:* || "$CUSTOM_KERNEL_REPO_REF" == tag:* ]]; then
              KERNELBRANCH_ARG=("KERNELBRANCH=$CUSTOM_KERNEL_REPO_REF")
            else
              KERNELBRANCH_ARG=("KERNELBRANCH=branch:$CUSTOM_KERNEL_REPO_REF")
            fi
            export DBAI_KERNEL_MODE="Recompile Custom Kernel"
          else
            export DBAI_KERNEL_MODE="$BUILD_KERNEL_MODE"
          fi

          export DBAI_APP_PROFILE="$APP_PROFILE_EFFECTIVE"
          ENABLE_EXTENSIONS="$(IFS=,; echo "${EXTENSIONS[*]}")"
          echo "Board=$BOARD Release=$RELEASE Profile=$PROFILE Filesystem=$FILESYSTEM Kernel=$BUILD_KERNEL_MODE App=$APP_PROFILE_EFFECTIVE Proxmox=$PROXMOX_VARIANT"
          echo "Extensions=$ENABLE_EXTENSIONS"
          ./compile.sh build             BOARD="$BOARD"             BRANCH=current             RELEASE="$RELEASE"             BUILD_MINIMAL="$BUILD_MINIMAL"             BUILD_DESKTOP="$BUILD_DESKTOP"             ROOTFS_TYPE="$FILESYSTEM"             FIXED_IMAGE_SIZE="$IMAGE_SIZE"             BOOTSIZE=256             COMPRESS_OUTPUTIMAGE=sha,xz             IMAGE_XZ_COMPRESSION_RATIO=0             KERNEL_CONFIGURE=no             ARTIFACT_IGNORE_CACHE="$ARTIFACT_IGNORE_CACHE"             ENABLE_EXTENSIONS="$ENABLE_EXTENSIONS" \
            "${KERNELSOURCE_ARG[@]}" "${KERNELBRANCH_ARG[@]}" "${BSPFREEZE_ARG[@]}"

          mkdir -p "$GITHUB_WORKSPACE/stage"
          shopt -s nullglob
          images=(output/images/*.img output/images/*.img.xz output/images/*.img.gz output/images/*.img.zst)
          (("${#images[@]}" > 0)) || { echo "::error::No image file found under output/images"; exit 1; }
          case "$PROFILE" in
            application) PROFILE_VARIANT="$APP_PROFILE_EFFECTIVE" ;;
            proxmox) PROFILE_VARIANT="proxmox-$PROXMOX_VARIANT" ;;
            *) PROFILE_VARIANT="$PROFILE" ;;
          esac
          for image in "${images[@]}"; do
            base="$(basename "$image")"
            case "$base" in
              *.img.xz) suffix=".img.xz" ;;
              *.img.gz) suffix=".img.gz" ;;
              *.img.zst) suffix=".img.zst" ;;
              *.img) suffix=".img" ;;
              *) echo "::error::Unrecognized image format: $base"; exit 1 ;;
            esac
            safe_base="DBAI-${BOARD}-${FILESYSTEM}-${RELEASE}-${PROFILE_VARIANT}${suffix}"
            cp "$image" "$GITHUB_WORKSPACE/stage/$safe_base"
            bytes="$(stat -c '%s' "$GITHUB_WORKSPACE/stage/$safe_base")"
            if (( bytes > 1900000000 )); then
              echo "::error::Asset $safe_base is larger than 1.9 GB; split/compress it before publishing to GitHub Releases."
              exit 1
            fi
          done

          cat > "$GITHUB_WORKSPACE/stage/manifest.json" <<EOF
          {
            "repository": "$GITHUB_REPOSITORY",
            "board": "$BOARD",
            "release": "$RELEASE",
            "profile": "$PROFILE",
            "filesystem": "$FILESYSTEM",
            "kernel_mode": "$BUILD_KERNEL_MODE",
            "kernel_source_repository": "$CUSTOM_KERNEL_REPO_URL",
            "kernel_source_ref": "$CUSTOM_KERNEL_REPO_REF",
            "kernel_patch_series": "$KERNEL_PATCH_SERIES",
            "application": "$APP_PROFILE_EFFECTIVE",
            "proxmox_mode": "$PROXMOX_MODE",
            "proxmox_variant": "$PROXMOX_VARIANT",
            "source_repository": "$SOURCE_REPO",
            "source_commit": "$SOURCE_SHA",
            "source_ref": "$SOURCE_REF",
            "run_id": "$GITHUB_RUN_ID",
            "run_attempt": "$GITHUB_RUN_ATTEMPT"
          }
          EOF
          mv "$GITHUB_WORKSPACE/stage/manifest.json" "$GITHUB_WORKSPACE/stage/DBAI-${BOARD}-${FILESYSTEM}-${RELEASE}-${PROFILE_VARIANT}-manifest.json"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbai-${{ matrix.release }}-${{ matrix.profile }}-${{ matrix.proxmox_variant }}-${{ matrix.filesystem }}
          path: stage/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Verify and publish firmware release
    needs: [plan, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.DBAI_RELEASE_TOKEN }}
      BOARD: ${{ needs.plan.outputs.board }}
      RELEASES_INPUT: ${{ inputs.releases || 'trixie' }}
      PROFILES_INPUT: ${{ inputs.profiles || 'minimal,server,application,desktop' }}
      FILESYSTEM_INPUT: ${{ inputs.filesystem || 'ext4' }}
      APP_PROFILE: ${{ inputs.app_profile || 'none' }}
      PROXMOX_MODE: ${{ inputs.proxmox_mode || 'official' }}
      DELETE_OLD: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[dbai-smoke]') && 'false' || 'true' }}
    steps:
      - name: Report release assembly runner resources
        shell: bash
        run: |
          echo "Runner: $(uname -a)"
          df -hT / /mnt "$GITHUB_WORKSPACE" || true
          free -h

      - name: Maximize release assembly disk
        uses: easimon/maximize-build-space@v10
        timeout-minutes: 10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dbai-*
          path: dist
          merge-multiple: true

      - name: Verify assets and prepare checksums
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Add repository secret DBAI_RELEASE_TOKEN before publishing a release."
            exit 1
          fi
          shopt -s nullglob
          files=(dist/*)
          (("${#files[@]}" > 0)) || { echo "::error::No build artifacts were downloaded"; exit 1; }
          (cd dist && sha256sum -- * > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)

          TAG="dbai-build-$(date -u +'%Y%m%d-%H%M%S')-$GITHUB_RUN_ID"
          TITLE="DBAI Armbian ${BOARD} ${RELEASES_INPUT} [${PROFILES_INPUT}] [${FILESYSTEM_INPUT}] app-${APP_PROFILE} pve-${PROXMOX_MODE} $(date -u +'%Y-%m-%d_%H-%M')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Publish release and verify remote assets
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          set -euo pipefail
          cleanup_partial_release() {
            status=$?
            if [[ $status -ne 0 ]]; then
              echo "::error::Release failed verification; removing partial release/tag."
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
              git push origin ":refs/tags/$TAG" || true
            fi
            exit "$status"
          }
          trap cleanup_partial_release EXIT

          gh release create "$TAG" dist/*             --repo "$GITHUB_REPOSITORY"             --title "$TITLE"             --prerelease             --notes "DBAI firmware batch. Board: $BOARD. Application profile: $APP_PROFILE. Proxmox mode: $PROXMOX_MODE. Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Every image includes a build manifest and SHA-256 checksum. Test on target hardware before production use."

          CHECK_DIR="$RUNNER_TEMP/dbai-release-check"
          mkdir -p "$CHECK_DIR"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$CHECK_DIR"
          while IFS=' ' read -r expected filename; do
            [[ -n "$filename" ]] || continue
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$filename" --dir "$CHECK_DIR"
            printf '%s  %s\n' "$expected" "$filename" | (cd "$CHECK_DIR" && sha256sum -c -)
            rm -f "$CHECK_DIR/$filename"
          done < "$CHECK_DIR/SHA256SUMS"

          if [[ "$DELETE_OLD" == "true" ]]; then
            gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName               | jq -r --arg current "$TAG" '.[] | select(.tagName | startswith("dbai-build-")) | select(.tagName != $current) | .tagName'               | while IFS= read -r old_tag; do
                  [[ -n "$old_tag" ]] || continue
                  echo "Removing previously verified DBAI build release: $old_tag"
                  gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || echo "::warning::Could not delete old release $old_tag"
                done
          fi
          echo "Verified release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          trap - EXIT
