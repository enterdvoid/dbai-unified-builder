# Temporary smoke-build trigger; remove after the exact regression scenario finishes.
name: DBAI Unified Firmware Builder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dbai-build.yml"
  workflow_dispatch:
    inputs:
      board:
        description: "Board target; choose custom to enter an exact board ID below"
        type: choice
        required: true
        default: aml-s9xx-box
        options:
          - aml-s9xx-box
          - orangepi5-plus
          - orangepi5
          - orangepi3-lts
          - odroidn2
          - odroidm1
          - odroidc4
          - khadas-vim4
          - nanopi-r4s
          - bananapim5
          - rock-5b
          - custom
      custom_board_name:
        description: "Only used when board=custom; exact ID from config/boards/<ID>.*"
        type: string
        required: false
        default: ""
      source_ref:
        description: "Armbian source branch/tag/commit (use a commit SHA for reproducibility)"
        type: string
        required: true
        default: main
      armbian_version_release:
        description: "Armbian Version Release selection"
        type: choice
        required: true
        default: Custom
        options:
          - All
          - Ubuntu Only
          - Debian Only
          - Custom
      custom_releases:
        description: "Used only with Custom; comma-separated release codenames (e.g. trixie,resolute)"
        type: string
        required: false
        default: "trixie,resolute"
      build_minimal:
        description: "Build a Minimal image"
        type: boolean
        required: true
        default: true
      build_server:
        description: "Build a Server image"
        type: boolean
        required: true
        default: true
      build_application:
        description: "Build an Application image; controlled by the application selector below"
        type: boolean
        required: true
        default: true
      build_desktop:
        description: "Build a Desktop image"
        type: boolean
        required: true
        default: true
      filesystem:
        description: "Build ext4, btrfs, or both variants"
        type: choice
        required: true
        default: both
        options:
          - both
          - ext4
          - btrfs
      app_profile:
        description: "Application installed into Application images only. Incompatible OS releases are skipped; choose none for a generic image."
        type: choice
        required: true
        default: casaos
        options:
          - none
          - homeassistant
          - openmediavault
          - casaos
          - hermes-9router
          - lightnvr-go2rtc
          - hermes-9router-lightnvr
          - proxmox-official
          - proxmox-community
          - proxmox-both
      kernel_mode:
        description: "Kernel Official uses a matching cached artifact only and fails on cache miss; Recompile modes build from source"
        type: choice
        required: true
        default: Kernel Official
        options:
          - Kernel Official
          - Recompile Kernel Official
          - Custom Kernel
          - Recompile Custom Kernel
      kernel_custom_input:
        description: "Custom Kernel: one HTTPS bundle URL. Recompile Custom Kernel: HTTPS Git URL optionally followed by #branch:<name> or #tag:<name>."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: dbai-builder-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dbai-smoke]') }}
    name: Validate inputs and expand build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      board: ${{ steps.matrix.outputs.board }}
      releases: ${{ steps.matrix.outputs.releases }}
      profiles: ${{ steps.matrix.outputs.profiles }}
    steps:
      - uses: actions/checkout@v4
      - name: Run input and kernel guard tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-validate-inputs.sh
          bash tests/test-kernel-cache-guard.sh
      - name: Validate inputs and create matrix
        id: matrix
        shell: bash
        env:
          BOARD_INPUT: ${{ inputs.board || 'aml-s9xx-box' }}
          CUSTOM_BOARD: ${{ inputs.custom_board_name || '' }}
          RELEASE_GROUP: ${{ inputs.armbian_version_release || 'Custom' }}
          CUSTOM_RELEASES: ${{ inputs.custom_releases || 'trixie,resolute' }}
          BUILD_MINIMAL_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_minimal || github.event_name != 'workflow_dispatch' }}
          BUILD_SERVER_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_server || github.event_name != 'workflow_dispatch' }}
          BUILD_APPLICATION_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_application || github.event_name != 'workflow_dispatch' }}
          BUILD_DESKTOP_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_desktop || github.event_name != 'workflow_dispatch' }}
          FILESYSTEM_INPUT: ${{ inputs.filesystem || 'ext4' }}
          KERNEL_MODE: ${{ inputs.kernel_mode || 'Kernel Official' }}
          APP_PROFILE: ${{ inputs.app_profile || 'none' }}
          KERNEL_CUSTOM_INPUT: ${{ inputs.kernel_custom_input || '' }}
          KERNEL_PATCH_SERIES: meson64-current
        run: |
          set -euo pipefail
          BOARD="$BOARD_INPUT"
          if [[ "$BOARD" == "custom" ]]; then BOARD="$CUSTOM_BOARD"; fi
          case "$RELEASE_GROUP" in
            "All") RELEASES_INPUT="bullseye,bookworm,trixie,forky,jammy,noble,resolute" ;;
            "Ubuntu Only") RELEASES_INPUT="jammy,noble,resolute" ;;
            "Debian Only") RELEASES_INPUT="bullseye,bookworm,trixie,forky" ;;
            "Custom") RELEASES_INPUT="$CUSTOM_RELEASES" ;;
            *) echo "::error::Unknown Armbian Version Release selection: $RELEASE_GROUP"; exit 2 ;;
          esac
          [[ -n "${RELEASES_INPUT//[[:space:]]/}" ]] || { echo "::error::Custom releases cannot be empty."; exit 2; }
          PROFILES_INPUT="$(bash scripts/resolve-selected-profiles.sh "$BUILD_MINIMAL_INPUT" "$BUILD_SERVER_INPUT" "$BUILD_APPLICATION_INPUT" "$BUILD_DESKTOP_INPUT")"
          echo "Resolved releases: $RELEASES_INPUT"
          echo "Selected image types: $PROFILES_INPUT"
          bash scripts/validate-inputs.sh "$BOARD" "" "$RELEASES_INPUT" "$PROFILES_INPUT" "$FILESYSTEM_INPUT" "$KERNEL_MODE" "$APP_PROFILE"
          if [[ "$KERNEL_MODE" == "Custom Kernel" || "$KERNEL_MODE" == "Recompile Custom Kernel" ]]; then
            bootfs_archive="$GITHUB_WORKSPACE/platform/bootfs_custom_kernel.tar.gz"
            [[ -f "$bootfs_archive" ]] || { echo "::error::Missing $bootfs_archive. Add your custom bootfs archive before using a custom kernel mode."; exit 2; }
            tar -tzf "$bootfs_archive" >/dev/null || { echo "::error::bootfs_custom_kernel.tar.gz is not a valid gzip-compressed tar archive."; exit 2; }
            if ! tar -tzf "$bootfs_archive" | awk ' /^\// { bad=1 } /(^|\/)\.\.(\/|$)/ { bad=1 } END { exit bad }'; then
              echo "::error::Unsafe absolute or parent-traversal path in custom bootfs archive."; exit 2
            fi
            [[ -n "$(tar -tzf "$bootfs_archive" | awk 'NF && $0 !~ /^\.\/?$/ { found=1 } END { exit !found }')" ]] || { echo "::error::Custom bootfs archive is empty."; exit 2; }
          fi
          if [[ "$KERNEL_MODE" == "Custom Kernel" ]]; then
            [[ "$KERNEL_CUSTOM_INPUT" =~ ^https:// ]] || { echo "::error::Custom Kernel requires one HTTPS URL to a .tar.gz/.tar.xz bundle."; exit 2; }
            temp_dir="$(mktemp -d)"
            curl --fail --location --silent --show-error --retry 3 "$KERNEL_CUSTOM_INPUT" --output "$temp_dir/kernel-bundle.tar"
            tar -tf "$temp_dir/kernel-bundle.tar" >/dev/null || { echo "::error::Custom kernel bundle is not a valid tar archive"; exit 2; }
            if ! tar -tf "$temp_dir/kernel-bundle.tar" | awk ' /^\// { bad=1 } /(^|\/)\.\.(\/|$)/ { bad=1 } END { exit bad }'; then
              echo "::error::Unsafe path in custom kernel bundle"; exit 2
            fi
            mkdir "$temp_dir/unpacked"
            tar -xf "$temp_dir/kernel-bundle.tar" -C "$temp_dir/unpacked"
            for spec in "boot:boot-" "dtb:dtb-amlogic-" "headers:header-" "modules:modules-"; do
              label="${spec%%:*}"; prefix="${spec#*:}"
              mapfile -t matches < <(find "$temp_dir/unpacked" -type f \( -name "${prefix}*.tar.gz" -o -name "${prefix}*.tar.xz" \))
              [[ "${#matches[@]}" -eq 1 ]] || { echo "::error::Bundle must contain exactly one ${prefix}*.tar.gz or .tar.xz archive"; exit 2; }
              cp "${matches[0]}" "$temp_dir/$label.tar"
              tar -tf "$temp_dir/$label.tar" >/dev/null || { echo "::error::Inner $label archive is invalid"; exit 2; }
              if ! tar -tf "$temp_dir/$label.tar" | awk ' /^\// { bad=1 } /(^|\/)\.\.(\/|$)/ { bad=1 } END { exit bad }'; then
                echo "::error::Unsafe path in inner $label archive"; exit 2
              fi
            done
            tar -tf "$temp_dir/boot.tar" | grep -Eq '^boot/' || { echo "::error::Boot archive needs paths under boot/"; exit 2; }
            tar -tf "$temp_dir/dtb.tar" | grep -Eq '^boot/.*\.dtb$' || { echo "::error::DTB archive needs .dtb files under boot/"; exit 2; }
            tar -tf "$temp_dir/modules.tar" | grep -Eq '^lib/modules/[^/]+/' || { echo "::error::Modules archive needs lib/modules/<release>/"; exit 2; }
            tar -tf "$temp_dir/headers.tar" | grep -Eq '^(usr/src/|lib/modules/[^/]+/build)' || { echo "::error::Headers archive needs usr/src/ or matching modules build paths"; exit 2; }
            rm -rf "$temp_dir"
          elif [[ "$KERNEL_MODE" == "Recompile Custom Kernel" ]]; then
            CUSTOM_KERNEL_REPO_URL="${KERNEL_CUSTOM_INPUT%%#*}"
            CUSTOM_KERNEL_REPO_REF="main"
            if [[ "$KERNEL_CUSTOM_INPUT" == *#* ]]; then CUSTOM_KERNEL_REPO_REF="${KERNEL_CUSTOM_INPUT#*#}"; fi
            [[ "$CUSTOM_KERNEL_REPO_URL" =~ ^https:// ]] || { echo "::error::Recompile Custom Kernel needs an HTTPS Git URL, optionally followed by #branch:<name> or #tag:<name>."; exit 2; }
            [[ "$CUSTOM_KERNEL_REPO_REF" =~ ^(branch:|tag:)?[A-Za-z0-9._/-]+$ ]] || { echo "::error::Custom kernel repo ref must be a branch name or tag (optionally prefixed with branch: or tag:)."; exit 2; }
          fi

          IFS=',' read -r -a releases <<< "$RELEASES_INPUT"
          IFS=',' read -r -a profiles <<< "$PROFILES_INPUT"
          filesystems=()
          case "$FILESYSTEM_INPUT" in
            both) filesystems=(ext4 btrfs) ;;
            ext4|btrfs) filesystems=("$FILESYSTEM_INPUT") ;;
          esac
          matrix='{"include":[]}'
          for release in "${releases[@]}"; do
            release="$(xargs <<< "$release")"
            for profile in "${profiles[@]}"; do
              profile="$(xargs <<< "$profile")"
              app_variant="none"
              if [[ "$profile" == "application" ]]; then
                if ! app_variant="$(bash scripts/resolve-app-variant.sh "$APP_PROFILE" "$release")"; then
                  echo "::error::Could not resolve application '$APP_PROFILE' for release '$release'."
                  exit 2
                fi
                if [[ -z "$app_variant" ]]; then
                  echo "::notice::Skipping Application image for '$release': app '$APP_PROFILE' is not compatible with this release."
                  continue
                fi
              fi
              for fs in "${filesystems[@]}"; do
                matrix="$(jq -c --arg release "$release" --arg profile "$profile" --arg filesystem "$fs" --arg app_variant "$app_variant" '.include += [{release:$release,profile:$profile,filesystem:$filesystem,app_variant:$app_variant}]' <<< "$matrix")"
              done
            done
          done
          if [[ "$(jq '.include | length' <<< "$matrix")" -eq 0 ]]; then
            echo "::error::No build combinations remain. Check selected image types, OS releases, and application compatibility."
            exit 2
          fi
          {
            echo "matrix=$matrix"
            echo "board=$BOARD"
            echo "releases=$RELEASES_INPUT"
            echo "profiles=$PROFILES_INPUT"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved board: $BOARD"
          echo "Planned combinations: $(jq '.include | length' <<< "$matrix")"
          jq . <<< "$matrix"

  build:
    name: ${{ matrix.release }} / ${{ matrix.profile }} / ${{ matrix.app_variant }} / ${{ matrix.filesystem }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BOARD: ${{ needs.plan.outputs.board }}
      RELEASE: ${{ matrix.release }}
      PROFILE: ${{ matrix.profile }}
      FILESYSTEM: ${{ matrix.filesystem }}
      SOURCE_REF: ${{ inputs.source_ref || 'main' }}
      KERNEL_MODE: ${{ inputs.kernel_mode || 'Kernel Official' }}
      APP_PROFILE: ${{ inputs.app_profile || 'none' }}
      APP_VARIANT: ${{ matrix.app_variant }}
      KERNEL_CUSTOM_INPUT: ${{ inputs.kernel_custom_input || '' }}
      KERNEL_PATCH_SERIES: meson64-current
    steps:
      - name: Report runner resources before disk setup
        shell: bash
        run: |
          echo "Runner: $(uname -a)"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "=== Filesystems before disk setup ==="
          df -hT / /mnt "$GITHUB_WORKSPACE" || true
          lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS || true
          echo "=== Memory and swap ==="
          free -h
          swapon --show || true

      - name: Maximize available build disk
        uses: easimon/maximize-build-space@v10
        timeout-minutes: 10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Move Docker storage to large build volume
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker_root="$GITHUB_WORKSPACE/.docker-data"
          exclude_file="$GITHUB_WORKSPACE/.git/info/exclude"
          grep -qxF '/.docker-data/' "$exclude_file" || printf '\n/.docker-data/\n' >> "$exclude_file"
          sudo systemctl stop docker.socket docker.service || true
          sudo mkdir -p "$docker_root"
          sudo chown root:root "$docker_root"
          sudo python3 - "$docker_root" <<'PY'
          import json, os, sys
          path = "/etc/docker/daemon.json"
          try:
              with open(path, encoding="utf-8") as f:
                  config = json.load(f)
          except FileNotFoundError:
              config = {}
          config["data-root"] = sys.argv[1]
          tmp = path + ".tmp"
          with open(tmp, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          os.replace(tmp, path)
          PY
          sudo systemctl start docker
          for _ in {1..30}; do
            if docker info >/dev/null 2>&1; then break; fi
            sleep 2
          done
          actual_root="$(docker info --format '{{.DockerRootDir}}')"
          echo "DockerRootDir=$actual_root"
          [[ "$actual_root" == "$docker_root" ]] || { echo "::error::Docker did not switch to the large workspace volume."; exit 1; }
          df -h "$docker_root" "$GITHUB_WORKSPACE"
          available_gb="$(df -BG --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -dc '0-9')"
          (( available_gb >= 35 )) || { echo "::error::Only ${available_gb} GB free in build workspace; at least 35 GB is required."; exit 1; }

      - name: Register ARM64 QEMU binfmt on runner host
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Armbian builds ARM root filesystems inside Docker. Register QEMU on
          # the runner host first; enabling binfmt only inside the build container
          # fails because that container cannot update the host kernel registry.
          docker run --privileged --rm tonistiigi/binfmt:latest --install arm64
          if ! sudo test -r /proc/sys/fs/binfmt_misc/qemu-aarch64; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc || true
          fi
          if ! sudo test -r /proc/sys/fs/binfmt_misc/qemu-aarch64; then
            echo "::error::QEMU ARM64 binfmt registration did not create qemu-aarch64 on the runner host."
            exit 1
          fi
          sudo cat /proc/sys/fs/binfmt_misc/qemu-aarch64
          sudo grep -q '^enabled' /proc/sys/fs/binfmt_misc/qemu-aarch64 || {
            echo "::error::QEMU ARM64 binfmt exists but is not enabled."
            exit 1
          }

      - name: Resolve source and verify board ID
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BOARD" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid board ID"; exit 2; }
          # SOURCE_REF is supplied by the job-level environment.
          # shellcheck disable=SC2153
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::source_ref contains unsupported characters"; exit 2; }

          # Prefer the official Armbian framework so Kernel Official can match
          # the public Armbian OCI artifact cache. The DBAI fork changes framework
          # hashes and can force a cache miss even when the kernel inputs are identical.
          SOURCE_REPO="armbian/build"

          clone_source() {
            local repo="$1"
            rm -rf armbian-source
            git clone --filter=blob:none --no-checkout "https://github.com/$repo.git" armbian-source
            git -C armbian-source fetch --depth=1 origin "$SOURCE_REF"
            git -C armbian-source checkout --detach FETCH_HEAD
          }

          clone_source "$SOURCE_REPO"
          if ! find armbian-source/config/boards -maxdepth 1 -type f -name "$BOARD.*" -print -quit | grep -q .; then
            echo "Board '$BOARD' not found in official Armbian source; trying DBAI fork."
            SOURCE_REPO="enterdvoid/build"
            clone_source "$SOURCE_REPO"
          fi
          if ! find armbian-source/config/boards -maxdepth 1 -type f -name "$BOARD.*" -print -quit | grep -q .; then
            echo "::error::Board '$BOARD' was not found as config/boards/$BOARD.* in source $SOURCE_REPO at ref $SOURCE_REF."
            echo "Check the exact board ID and source ref. Custom input is not a promise of support by either source."
            exit 2
          fi

          SOURCE_SHA="$(git -C armbian-source rev-parse HEAD)"
          {
            echo "repo=$SOURCE_REPO"
            echo "sha=$SOURCE_SHA"
            echo "source_ref=$SOURCE_REF"
          } >> "$GITHUB_OUTPUT"
          echo "Using $SOURCE_REPO@$SOURCE_SHA for $BOARD"

      - name: Add DBAI build extensions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p armbian-source/userpatches/extensions
          cp extensions/dbai-casaos.sh armbian-source/userpatches/extensions/
          cp extensions/dbai-apps.sh armbian-source/userpatches/extensions/
          cp extensions/dbai-custom-kernel.sh armbian-source/userpatches/extensions/
          cp extensions/dbai-custom-bootfs.sh armbian-source/userpatches/extensions/
          if [[ "$KERNEL_MODE" == "Custom Kernel" || "$KERNEL_MODE" == "Recompile Custom Kernel" ]]; then
            mkdir -p armbian-source/userpatches/platform
            cp "$GITHUB_WORKSPACE/platform/bootfs_custom_kernel.tar.gz" armbian-source/userpatches/platform/
          fi
          if [[ "$KERNEL_MODE" == "Recompile Kernel Official" || "$KERNEL_MODE" == "Recompile Custom Kernel" ]]; then
            mkdir -p "armbian-source/userpatches/kernel/archive/$KERNEL_PATCH_SERIES"
            shopt -s nullglob
            patch_files=("$GITHUB_WORKSPACE/kernel-patches/$KERNEL_PATCH_SERIES"/*.patch)
            if (("${#patch_files[@]}" > 0)); then
              cp "${patch_files[@]}" "armbian-source/userpatches/kernel/archive/$KERNEL_PATCH_SERIES/"
              echo "Installed ${#patch_files[@]} kernel patch(es) for explicit recompile mode from kernel-patches/$KERNEL_PATCH_SERIES"
            else
              echo "No optional kernel patches found in kernel-patches/$KERNEL_PATCH_SERIES"
            fi
          else
            echo "Skipping DBAI user kernel patches in $KERNEL_MODE to preserve official artifact-cache compatibility."
          fi
          mkdir -p armbian-source/extensions armbian-source/tools
          cp extensions/proxmox-official.sh armbian-source/extensions/
          cp extensions/proxmox-community.sh armbian-source/extensions/
          cp tools/dbai-vm-import armbian-source/tools/
          # Kernel Official may consume Armbian's prebuilt OCI artifact, but must never silently fall back to source compilation.
          python3 "$GITHUB_WORKSPACE/scripts/guard-kernel-cache-only.py" "$GITHUB_WORKSPACE/armbian-source/lib/functions/artifacts/artifact-kernel.sh" "$KERNEL_MODE"

      - name: Build firmware image
        shell: bash
        env:
          SOURCE_REPO: ${{ steps.source.outputs.repo }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          cd armbian-source

          BUILD_MINIMAL=no
          BUILD_DESKTOP=no
          IMAGE_SIZE=4096
          case "$PROFILE" in
            minimal) BUILD_MINIMAL=yes; IMAGE_SIZE=4096 ;;
            server) BUILD_MINIMAL=no; IMAGE_SIZE=4096 ;;
            application) BUILD_MINIMAL=no; IMAGE_SIZE=8192 ;;
            desktop) BUILD_MINIMAL=no; BUILD_DESKTOP=yes; IMAGE_SIZE=8192 ;;
            *) echo "::error::Unknown profile $PROFILE"; exit 2 ;;
          esac

          EXTENSIONS=()
          BUILD_KERNEL_MODE="$KERNEL_MODE"
          APP_PROFILE_EFFECTIVE="none"
          ARTIFACT_IGNORE_CACHE=no
          if [[ "$BUILD_KERNEL_MODE" == "Recompile Kernel Official" || "$BUILD_KERNEL_MODE" == "Recompile Custom Kernel" ]]; then ARTIFACT_IGNORE_CACHE=yes; fi
          BSPFREEZE_ARG=()
          if [[ "$PROFILE" == "application" ]]; then
            APP_PROFILE_EFFECTIVE="$APP_VARIANT"
            case "$APP_VARIANT" in
              proxmox-official)
                [[ "$RELEASE" == "trixie" ]] || { echo "::error::Proxmox Official application variant only supports Trixie."; exit 2; }
                EXTENSIONS+=(proxmox-official); BSPFREEZE_ARG=(BSPFREEZE=yes) ;;
              proxmox-community)
                [[ "$RELEASE" == "bookworm" ]] || { echo "::error::Proxmox Community application variant only supports Bookworm."; exit 2; }
                EXTENSIONS+=(proxmox-community); BSPFREEZE_ARG=(BSPFREEZE=yes) ;;
              homeassistant) EXTENSIONS+=(applications-ha) ;;
              openmediavault) EXTENSIONS+=(applications-omv) ;;
              casaos) EXTENSIONS+=(dbai-casaos) ;;
              hermes-9router|lightnvr-go2rtc|hermes-9router-lightnvr) EXTENSIONS+=(dbai-apps) ;;
              none) : ;;
              *) echo "::error::Unsupported application variant $APP_VARIANT"; exit 2 ;;
            esac
          fi
          KERNELSOURCE_ARG=()
          KERNELBRANCH_ARG=()
          if [[ "$BUILD_KERNEL_MODE" == "Custom Kernel" ]]; then
            export DBAI_KERNEL_BUNDLE_URL="$KERNEL_CUSTOM_INPUT"
            EXTENSIONS+=(dbai-custom-kernel dbai-custom-bootfs)
            export DBAI_KERNEL_MODE="Custom Kernel"
          elif [[ "$BUILD_KERNEL_MODE" == "Recompile Custom Kernel" ]]; then
            CUSTOM_KERNEL_REPO_URL="${KERNEL_CUSTOM_INPUT%%#*}"
            CUSTOM_KERNEL_REPO_REF="main"
            if [[ "$KERNEL_CUSTOM_INPUT" == *#* ]]; then CUSTOM_KERNEL_REPO_REF="${KERNEL_CUSTOM_INPUT#*#}"; fi
            KERNELSOURCE_ARG=("KERNELSOURCE=$CUSTOM_KERNEL_REPO_URL")
            if [[ "$CUSTOM_KERNEL_REPO_REF" == branch:* || "$CUSTOM_KERNEL_REPO_REF" == tag:* ]]; then KERNELBRANCH_ARG=("KERNELBRANCH=$CUSTOM_KERNEL_REPO_REF"); else KERNELBRANCH_ARG=("KERNELBRANCH=branch:$CUSTOM_KERNEL_REPO_REF"); fi
            EXTENSIONS+=(dbai-custom-bootfs)
            export DBAI_KERNEL_MODE="Recompile Custom Kernel"
          else
            export DBAI_KERNEL_MODE="$BUILD_KERNEL_MODE"
          fi

          export DBAI_APP_PROFILE="$APP_PROFILE_EFFECTIVE"
          ENABLE_EXTENSIONS="$(IFS=,; echo "${EXTENSIONS[*]}")"
          echo "Board=$BOARD Release=$RELEASE Profile=$PROFILE Filesystem=$FILESYSTEM Kernel=$BUILD_KERNEL_MODE App=$APP_PROFILE_EFFECTIVE"
          echo "Extensions=$ENABLE_EXTENSIONS"
          ./compile.sh build             BOARD="$BOARD"             BRANCH=current             RELEASE="$RELEASE"             BUILD_MINIMAL="$BUILD_MINIMAL"             BUILD_DESKTOP="$BUILD_DESKTOP"             ROOTFS_TYPE="$FILESYSTEM"             FIXED_IMAGE_SIZE="$IMAGE_SIZE"             BOOTSIZE=256             COMPRESS_OUTPUTIMAGE=sha,xz             IMAGE_XZ_COMPRESSION_RATIO=0             KERNEL_CONFIGURE=no             ARTIFACT_IGNORE_CACHE="$ARTIFACT_IGNORE_CACHE"             ENABLE_EXTENSIONS="$ENABLE_EXTENSIONS" \
            "${KERNELSOURCE_ARG[@]}" "${KERNELBRANCH_ARG[@]}" "${BSPFREEZE_ARG[@]}"

          mkdir -p "$GITHUB_WORKSPACE/stage"
          shopt -s nullglob
          images=(output/images/*.img output/images/*.img.xz output/images/*.img.gz output/images/*.img.zst)
          (("${#images[@]}" > 0)) || { echo "::error::No image file found under output/images"; exit 1; }
          case "$PROFILE" in
            application) PROFILE_VARIANT="$APP_PROFILE_EFFECTIVE" ;;
            *) PROFILE_VARIANT="$PROFILE" ;;
          esac
          SHORT_BOARD="${BOARD%-box}"
          for image in "${images[@]}"; do
            base="$(basename "$image")"
            # Armbian output may omit the profile suffix (e.g. *_6.18.57.img.xz).
            # Accept both profile-suffixed and unsuffixed image names.
            if [[ "$base" =~ ^Armbian(-unofficial)?_([^_]+)_([^_]+)_([^_]+)_([^_]+)_([^_.]+)(_((minimal|server|desktop)))?\.img(\.(xz|gz|zst))?$ ]]; then
              armbian_version="${BASH_REMATCH[2]}"
              image_board="${BASH_REMATCH[3]}"
              image_release="${BASH_REMATCH[4]}"
              image_branch="${BASH_REMATCH[5]}"
              kernel_version="${BASH_REMATCH[6]}"
              source_profile="${BASH_REMATCH[9]:-unknown}"
            else
              echo "::error::Cannot parse Armbian image filename: $base"
              exit 1
            fi

            [[ "$image_release" == "$RELEASE" ]] || {
              echo "::error::Image release in '$base' is '$image_release', expected '$RELEASE'."
              exit 1
            }
            [[ "${image_board,,}" == "${BOARD,,}" ]] || {
              echo "::error::Image board in '$base' is '$image_board', expected '$BOARD'."
              exit 1
            }

            armbian_version_filename="${armbian_version%-trunk}"
            case "$base" in
              *.img.xz) suffix=".img.xz"; source_txt="${image%.xz}.txt" ;;
              *.img.gz) suffix=".img.gz"; source_txt="${image%.gz}.txt" ;;
              *.img.zst) suffix=".img.zst"; source_txt="${image%.zst}.txt" ;;
              *.img) suffix=".img"; source_txt="${image}.txt" ;;
              *) echo "::error::Unrecognized image format: $base"; exit 1 ;;
            esac

            safe_base="DBAI-Armbian_${armbian_version_filename}-${SHORT_BOARD}-${RELEASE}-k${kernel_version}-${PROFILE_VARIANT}-${FILESYSTEM}${suffix}"
            stage_image="$GITHUB_WORKSPACE/stage/$safe_base"
            cp "$image" "$stage_image"

            if [[ ! -f "$source_txt" ]]; then
              echo "::error::Armbian build information file is missing: $source_txt"
              exit 1
            fi
            metadata_base="$safe_base"
            metadata_base="${metadata_base%.xz}"
            metadata_base="${metadata_base%.gz}"
            metadata_base="${metadata_base%.zst}"
            metadata_base="${metadata_base}.txt"
            metadata_path="$GITHUB_WORKSPACE/stage/$metadata_base"
            cp "$source_txt" "$metadata_path"

            # Make the upstream information file refer to the renamed release asset.
            python3 - "$metadata_path" "$base" "$safe_base" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          old_name, new_name = sys.argv[2], sys.argv[3]
          text = path.read_text(encoding="utf-8", errors="replace")
          path.write_text(text.replace(old_name, new_name), encoding="utf-8")
          PY

            image_size="$(stat -c '%s' "$stage_image")"
            if (( image_size > 1900000000 )); then
              echo "::error::Asset $safe_base is larger than 1.9 GB; split/compress it before publishing to GitHub Releases."
              exit 1
            fi
            image_sha="$(sha256sum "$stage_image" | awk '{print $1}')"

            cat >> "$metadata_path" <<EOF

          ================================================================================
          DBAI UNIFIED FIRMWARE BUILDER
          ================================================================================
          Release asset: $safe_base
          Board ID: $BOARD
          Armbian image version: $armbian_version
          OS release: $RELEASE
          Kernel version: $kernel_version
          Kernel branch: $image_branch
          Armbian source profile: $source_profile
          DBAI image profile: $PROFILE
          Application variant: $APP_PROFILE_EFFECTIVE
          Root filesystem: $FILESYSTEM
          Kernel mode: $BUILD_KERNEL_MODE
          Kernel patch series: $KERNEL_PATCH_SERIES
          Armbian source repository: $SOURCE_REPO
          Armbian source ref: $SOURCE_REF
          Armbian source commit: $SOURCE_SHA
          DBAI builder repository: $GITHUB_REPOSITORY
          DBAI builder commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Image size in bytes: $image_size
          Image SHA-256: $image_sha
          ================================================================================
          EOF
            echo "Staged image: $safe_base (Armbian $armbian_version; kernel $kernel_version)"
            echo "Staged build information: $metadata_base"
          done

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbai-${{ matrix.release }}-${{ matrix.profile }}-${{ matrix.app_variant }}-${{ matrix.filesystem }}
          path: stage/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Verify and publish firmware release
    needs: [plan, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BOARD: ${{ needs.plan.outputs.board }}
      RELEASES_INPUT: ${{ needs.plan.outputs.releases }}
      PROFILES_INPUT: ${{ needs.plan.outputs.profiles }}
      FILESYSTEM_INPUT: ${{ inputs.filesystem || 'ext4' }}
      KERNEL_MODE: ${{ inputs.kernel_mode || 'Kernel Official' }}
      SOURCE_REF: ${{ inputs.source_ref || 'main' }}
      APP_PROFILE: ${{ inputs.build_application && inputs.app_profile || 'none' }}
      DELETE_OLD: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[dbai-smoke]') && 'false' || 'true' }}
    steps:
      - name: Report release assembly runner resources
        shell: bash
        run: |
          echo "Runner: $(uname -a)"
          df -hT / /mnt "$GITHUB_WORKSPACE" || true
          free -h

      - name: Maximize release assembly disk
        uses: easimon/maximize-build-space@v10
        timeout-minutes: 10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dbai-*
          path: dist
          merge-multiple: true

      - name: Verify assets and prepare checksums
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::GitHub Actions token is unavailable. Check workflow permissions and repository Actions settings."
            exit 1
          fi
          shopt -s nullglob
          files=(dist/*)
          (("${#files[@]}" > 0)) || { echo "::error::No build artifacts were downloaded"; exit 1; }
          (cd dist && sha256sum -- * > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)

          NOTES_FILE="$RUNNER_TEMP/DBAI-RELEASE-NOTES.md"
          {
            echo "# DBAI Unified Firmware Builder"
            echo
            echo "Firmware images built with the Armbian build framework."
            echo
            echo "## Build batch"
            echo
            echo "- **Board:** $BOARD"
            echo "- **Requested OS releases:** $RELEASES_INPUT"
            echo "- **Image profiles:** $PROFILES_INPUT"
            echo "- **Filesystem selection:** $FILESYSTEM_INPUT"
            echo "- **Application profile:** $APP_PROFILE"
            echo "- **Kernel mode:** $KERNEL_MODE"
            echo "- **Armbian source ref:** $SOURCE_REF"
            echo "- **Builder commit:** $GITHUB_SHA"
            echo "- **Workflow run:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "## Firmware assets"
            echo
            echo "The image filenames encode the Armbian image version, OS release, kernel version, image profile, and filesystem."
            echo "Each image is accompanied by an Armbian \`.img.txt\` build-information file containing upstream build details and DBAI-specific metadata."
            echo
            shopt -s nullglob
            found_image=false
            for asset in dist/DBAI-Armbian_*; do
              case "$asset" in
                *.img|*.img.xz|*.img.gz|*.img.zst)
                  found_image=true
                  name="$(basename "$asset")"
                  size="$(stat -c '%s' "$asset")"
                  echo "- \`$name\` — $size bytes"
                  ;;
              esac
            done
            [[ "$found_image" == true ]] || { echo "::error::No versioned DBAI Armbian image assets were found."; exit 1; }
            echo
            echo "## Integrity"
            echo
            echo "- \`SHA256SUMS\` contains SHA-256 checksums for every uploaded image and information file."
            echo "- Verify downloads with: \`sha256sum -c SHA256SUMS\`"
            echo
            echo "## Notes"
            echo
            echo "- Armbian version and kernel version in the filenames come from the actual output filename generated by the build framework."
            echo "- Test on target hardware before production use."
          } > "$NOTES_FILE"

          TAG="dbai-build-$(date -u +'%Y%m%d-%H%M%S')-$GITHUB_RUN_ID"
          TITLE="DBAI Armbian ${BOARD} ${RELEASES_INPUT} [${PROFILES_INPUT}] [${FILESYSTEM_INPUT}] app-${APP_PROFILE} $(date -u +'%Y-%m-%d_%H-%M')"
          {
            echo "tag=$TAG"
            echo "title=$TITLE"
            echo "notes_file=$NOTES_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release and verify remote assets
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: |
          set -euo pipefail
          cleanup_partial_release() {
            status=$?
            if [[ $status -ne 0 ]]; then
              echo "::error::Release failed verification; removing partial release/tag."
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
              git push origin ":refs/tags/$TAG" || true
            fi
            exit "$status"
          }
          trap cleanup_partial_release EXIT

          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TITLE" --prerelease --notes-file "$NOTES_FILE"

          CHECK_DIR="$RUNNER_TEMP/dbai-release-check"
          mkdir -p "$CHECK_DIR"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$CHECK_DIR"
          while IFS=' ' read -r expected filename; do
            [[ -n "$filename" ]] || continue
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$filename" --dir "$CHECK_DIR"
            printf '%s  %s\n' "$expected" "$filename" | (cd "$CHECK_DIR" && sha256sum -c -)
            rm -f "$CHECK_DIR/$filename"
          done < "$CHECK_DIR/SHA256SUMS"

          if [[ "$DELETE_OLD" == "true" ]]; then
            gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName               | jq -r --arg current "$TAG" '.[] | select(.tagName | startswith("dbai-build-")) | select(.tagName != $current) | .tagName'               | while IFS= read -r old_tag; do
                  [[ -n "$old_tag" ]] || continue
                  echo "Removing previously verified DBAI build release: $old_tag"
                  gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || echo "::warning::Could not delete old release $old_tag"
                done
          fi
          echo "Verified release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          trap - EXIT
