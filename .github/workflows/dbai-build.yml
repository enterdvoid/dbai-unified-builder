name: DBAI Unified Firmware Builder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dbai-build.yml"
      # Commit subjects with [dbai-smoke-app] run a single Trixie/ext4
      # Application + Proxmox Official custom-kernel regression build.
      # This verifies original vmlinuz/uInitrd bytes and their manifest checksums.
      # All smoke builds skip release publication.
  workflow_dispatch:
    inputs:
      board:
        description: "Board target; choose custom to enter an exact board ID below"
        type: choice
        required: true
        default: aml-s9xx-box
        options:
          - aml-s9xx-box
          - orangepi5-plus
          - orangepi5
          - orangepi3-lts
          - odroidn2
          - odroidm1
          - odroidc4
          - khadas-vim4
          - nanopi-r4s
          - bananapim5
          - rock-5b
          - custom
      custom_board_name:
        description: "Only used when board=custom; exact ID from config/boards/<ID>.*"
        type: string
        required: false
        default: ""
      source_ref:
        description: "Armbian source branch/tag/commit (use a commit SHA for reproducibility)"
        type: string
        required: true
        default: main
      armbian_version_release:
        description: "Armbian Version Release selection"
        type: choice
        required: true
        default: Custom
        options:
          - All
          - Ubuntu Only
          - Debian Only
          - Custom
      custom_releases:
        description: "Used only with Custom; comma-separated release codenames (e.g. trixie,resolute)"
        type: string
        required: false
        default: "trixie,resolute"
      build_minimal:
        description: "Build a Minimal image"
        type: boolean
        required: true
        default: true
      build_server:
        description: "Build a Server image"
        type: boolean
        required: true
        default: true
      build_application:
        description: "Build an Application image; controlled by the application selector below"
        type: boolean
        required: true
        default: true
      build_desktop:
        description: "Build Desktop image(s) using the selected environment below"
        type: boolean
        required: true
        default: true
      desktop_environment:
        description: "Desktop environment for Desktop images; all expands to every compatible environment. Openbox is a standalone lightweight session."
        type: choice
        required: true
        default: xfce
        options:
          - all
          - xfce
          - mate
          - gnome
          - cinnamon
          - kde-plasma
          - lxqt
          - i3-wm
          - enlightenment
          - budgie
          - openbox
      desktop_tier:
        description: "Package tier for Armbian desktop environments; Openbox ignores this setting"
        type: choice
        required: true
        default: mid
        options:
          - minimal
          - mid
          - full
      filesystem:
        description: "Build ext4, btrfs, or both variants"
        type: choice
        required: true
        default: ext4
        options:
          - both
          - ext4
          - btrfs
      app_profile:
        description: "Application installed into Application images only. Incompatible OS releases are skipped; choose none for a generic image."
        type: choice
        required: true
        default: none
        options:
          - all
          - none
          - homeassistant
          - openmediavault
          - casaos
          - hermes-9router
          - lightnvr-go2rtc
          - hermes-9router-lightnvr
          - proxmox-official
          - proxmox-community
          - proxmox-both
      kernel_mode:
        description: "Kernel Official uses a matching cached artifact only and fails on cache miss; Recompile modes build from source"
        type: choice
        required: true
        default: Kernel Official
        options:
          - Kernel Official
          - Recompile Kernel Official
          - Custom Kernel
          - Recompile Custom Kernel
      kernel_custom_input:
        description: "Custom Kernel: one HTTPS bundle URL. Recompile Custom Kernel: HTTPS Git URL optionally followed by #branch:<name> or #tag:<name>."
        type: string
        required: false
        default: ""

# Keep the DBAI product version independent of the upstream Armbian "-trunk" development suffix.
env:
  DBAI_IMAGE_VERSION: "26.11.0"

permissions:
  contents: read

concurrency:
  group: dbai-builder-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dbai-smoke]') || contains(github.event.head_commit.message, '[dbai-smoke-desktop]') || contains(github.event.head_commit.message, '[dbai-smoke-app]') }}
    name: Validate inputs and expand build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      board: ${{ steps.matrix.outputs.board }}
      releases: ${{ steps.matrix.outputs.releases }}
      profiles: ${{ steps.matrix.outputs.profiles }}
      custom_kernel_release: ${{ steps.matrix.outputs.custom_kernel_release }}
    steps:
      - uses: actions/checkout@v4
      - name: Run input and kernel guard tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-validate-inputs.sh
          bash tests/test-kernel-cache-guard.sh
      - name: Validate inputs and create matrix
        id: matrix
        shell: bash
        env:
          BOARD_INPUT: ${{ inputs.board || 'aml-s9xx-box' }}
          CUSTOM_BOARD: ${{ inputs.custom_board_name || '' }}
          RELEASE_GROUP: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[dbai-smoke]') || contains(github.event.head_commit.message, '[dbai-smoke-desktop]') || contains(github.event.head_commit.message, '[dbai-smoke-app]'))) && 'Custom' || inputs.armbian_version_release || 'Custom' }}
          CUSTOM_RELEASES: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[dbai-smoke]') || contains(github.event.head_commit.message, '[dbai-smoke-desktop]') || contains(github.event.head_commit.message, '[dbai-smoke-app]'))) && 'trixie' || inputs.custom_releases || 'trixie,resolute' }}
          BUILD_MINIMAL_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_minimal || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dbai-smoke]') && !contains(github.event.head_commit.message, '[dbai-smoke-desktop]') && !contains(github.event.head_commit.message, '[dbai-smoke-app]')) }}
          BUILD_SERVER_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[dbai-smoke]')) }}
          BUILD_APPLICATION_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_application || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dbai-smoke]') && !contains(github.event.head_commit.message, '[dbai-smoke-desktop]')) }}
          BUILD_DESKTOP_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_desktop || (github.event_name == 'push' && contains(github.event.head_commit.message, '[dbai-smoke-desktop]')) }}
          DESKTOP_ENVIRONMENT_INPUT: ${{ inputs.desktop_environment || 'xfce' }}
          DESKTOP_TIER_INPUT: ${{ inputs.desktop_tier || 'mid' }}
          FILESYSTEM_INPUT: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[dbai-smoke]') || contains(github.event.head_commit.message, '[dbai-smoke-desktop]') || contains(github.event.head_commit.message, '[dbai-smoke-app]'))) && 'ext4' || inputs.filesystem || 'ext4' }}
          KERNEL_MODE: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[dbai-smoke]') || contains(github.event.head_commit.message, '[dbai-smoke-desktop]') || contains(github.event.head_commit.message, '[dbai-smoke-app]'))) && 'Custom Kernel' || inputs.kernel_mode || 'Kernel Official' }}
          APP_PROFILE: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[dbai-smoke-app]')) && 'proxmox-official' || inputs.app_profile || 'none' }}
          KERNEL_CUSTOM_INPUT: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[dbai-smoke]') || contains(github.event.head_commit.message, '[dbai-smoke-desktop]') || contains(github.event.head_commit.message, '[dbai-smoke-app]'))) && 'https://github.com/armarchindo/kernel/releases/download/kernel_dbai/6.1.66-DBAI.tar.gz' || inputs.kernel_custom_input || '' }}
          KERNEL_PATCH_SERIES: meson64-current
        run: |
          set -euo pipefail
          BOARD="$BOARD_INPUT"
          if [[ "$BOARD" == "custom" ]]; then BOARD="$CUSTOM_BOARD"; fi
          case "$RELEASE_GROUP" in
            "All") RELEASES_INPUT="bullseye,bookworm,trixie,forky,jammy,noble,resolute" ;;
            "Ubuntu Only") RELEASES_INPUT="jammy,noble,resolute" ;;
            "Debian Only") RELEASES_INPUT="bullseye,bookworm,trixie,forky" ;;
            "Custom") RELEASES_INPUT="$CUSTOM_RELEASES" ;;
            *) echo "::error::Unknown Armbian Version Release selection: $RELEASE_GROUP"; exit 2 ;;
          esac
          [[ -n "${RELEASES_INPUT//[[:space:]]/}" ]] || { echo "::error::Custom releases cannot be empty."; exit 2; }
          PROFILES_INPUT="$(bash scripts/resolve-selected-profiles.sh "$BUILD_MINIMAL_INPUT" "$BUILD_SERVER_INPUT" "$BUILD_APPLICATION_INPUT" "$BUILD_DESKTOP_INPUT")"
          case "$DESKTOP_ENVIRONMENT_INPUT" in
            all|xfce|mate|gnome|cinnamon|kde-plasma|lxqt|i3-wm|enlightenment|budgie|openbox) ;;
            *) echo "::error::Unknown desktop environment selection: $DESKTOP_ENVIRONMENT_INPUT"; exit 2 ;;
          esac
          case "$DESKTOP_TIER_INPUT" in
            minimal|mid|full) ;;
            *) echo "::error::Unknown desktop package tier: $DESKTOP_TIER_INPUT"; exit 2 ;;
          esac
          echo "Resolved releases: $RELEASES_INPUT"
          echo "Selected image types: $PROFILES_INPUT"
          echo "Desktop environment selection: $DESKTOP_ENVIRONMENT_INPUT; tier: $DESKTOP_TIER_INPUT"
          bash scripts/validate-inputs.sh "$BOARD" "" "$RELEASES_INPUT" "$PROFILES_INPUT" "$FILESYSTEM_INPUT" "$KERNEL_MODE" "$APP_PROFILE"
          if [[ "$KERNEL_MODE" == "Custom Kernel" || "$KERNEL_MODE" == "Recompile Custom Kernel" ]]; then
            bootfs_archive="$GITHUB_WORKSPACE/platform/bootfs_custom_kernel.tar.gz"
            [[ -f "$bootfs_archive" ]] || { echo "::error::Missing $bootfs_archive. Add your custom bootfs archive before using a custom kernel mode."; exit 2; }
            tar -tzf "$bootfs_archive" >/dev/null || { echo "::error::bootfs_custom_kernel.tar.gz is not a valid gzip-compressed tar archive."; exit 2; }
            if ! tar -tzf "$bootfs_archive" | awk ' /^\// { bad=1 } /(^|\/)\.\.(\/|$)/ { bad=1 } END { exit bad }'; then
              echo "::error::Unsafe absolute or parent-traversal path in custom bootfs archive."; exit 2
            fi
            if ! tar -tzf "$bootfs_archive" | awk 'NF && $0 !~ /^\.\/?$/ { found=1 } END { exit !found }' >/dev/null; then
              echo "::error::Custom bootfs archive is empty."; exit 2
            fi
          fi
          CUSTOM_KERNEL_RELEASE=""
          if [[ "$KERNEL_MODE" == "Custom Kernel" ]]; then
            [[ "$KERNEL_CUSTOM_INPUT" =~ ^https:// ]] || { echo "::error::Custom Kernel requires one HTTPS URL to a .tar.gz/.tar.xz bundle."; exit 2; }
            temp_dir="$(mktemp -d)"
            curl --fail --location --silent --show-error --retry 3 "$KERNEL_CUSTOM_INPUT" --output "$temp_dir/kernel-bundle.tar"
            tar -tf "$temp_dir/kernel-bundle.tar" >/dev/null || { echo "::error::Custom kernel bundle is not a valid tar archive"; exit 2; }
            if ! tar -tf "$temp_dir/kernel-bundle.tar" | awk ' /^\// { bad=1 } /(^|\/)\.\.(\/|$)/ { bad=1 } END { exit bad }'; then
              echo "::error::Unsafe path in custom kernel bundle"; exit 2
            fi
            mkdir "$temp_dir/unpacked"
            tar -xf "$temp_dir/kernel-bundle.tar" -C "$temp_dir/unpacked"
            for spec in "boot:boot-" "dtb:dtb-amlogic-" "headers:header-" "modules:modules-"; do
              label="${spec%%:*}"; prefix="${spec#*:}"
              mapfile -t matches < <(find "$temp_dir/unpacked" -type f \( -name "${prefix}*.tar.gz" -o -name "${prefix}*.tar.xz" \))
              [[ "${#matches[@]}" -eq 1 ]] || { echo "::error::Bundle must contain exactly one ${prefix}*.tar.gz or .tar.xz archive"; exit 2; }
              cp "${matches[0]}" "$temp_dir/$label.tar"
              tar -tf "$temp_dir/$label.tar" >/dev/null || { echo "::error::Inner $label archive is invalid"; exit 2; }
              if ! tar -tf "$temp_dir/$label.tar" | awk ' /^\// { bad=1 } /(^|\/)\.\.(\/|$)/ { bad=1 } END { exit bad }'; then
                echo "::error::Unsafe path in inner $label archive"; exit 2
              fi
            done
            if ! tar -tf "$temp_dir/boot.tar" | grep -Eq '^(boot/.*|(\./)?(Image[^/]*|vmlinuz[^/]*|uImage|zImage|initrd[^/]*|uInitrd)(/|$))'; then
              echo "::error::Boot archive must contain files under boot/ or a recognizable kernel image at its archive root."; exit 2
            fi
            dtb_listing="$temp_dir/dtb-list.txt"
            tar -tf "$temp_dir/dtb.tar" > "$dtb_listing" || { echo "::error::Unable to read DTB archive file list."; exit 2; }
            if ! grep -Eq '(^|/)[^/]+[.]dtb' "$dtb_listing"; then
              echo "::error::DTB archive contains no .dtb files. First archive entries:"
              sed -n '1,40p' "$dtb_listing"
              exit 2
            fi
            echo "DTB archive paths (first 30 DTB files):"
            awk ' /(^|\/)[^/]+[.]dtb/ { print; count++; if (count >= 30) exit }' "$dtb_listing"
            modules_listing="$temp_dir/modules-list.txt"
            tar -tf "$temp_dir/modules.tar" > "$modules_listing" || { echo "::error::Unable to read modules archive file list."; exit 2; }
            if ! grep -Eq '^([.]/)?lib/modules/[^/]+/' "$modules_listing"; then
              if grep -Eq '^([.]/)?[^/]+/modules[.]dep$|^([.]/)?[^/]+/kernel/' "$modules_listing"; then
                echo "Detected release-root modules archive; installer will normalize it to lib/modules/<release>/."
              else
                echo "::error::Modules archive needs lib/modules/<release>/ or a top-level <release>/ module tree. First archive entries:"
                sed -n '1,40p' "$modules_listing"
                exit 2
              fi
            fi
            headers_listing="$temp_dir/headers-list.txt"
            tar -tf "$temp_dir/headers.tar" > "$headers_listing" || { echo "::error::Unable to read headers archive file list."; exit 2; }
            # Share the exact same archive classifier with the installer so their
            # path/layout assumptions cannot drift apart.
            source extensions/dbai-custom-kernel.sh
            if ! headers_layout="$(dbai_detect_kernel_headers_layout "$headers_listing")"; then
              echo "::error::Headers archive is neither a recognized kernel build tree nor a root include/ UAPI-only tree. First archive entries:"
              sed -n '1,40p' "$headers_listing"
              exit 2
            fi
            case "$headers_layout" in
              target-root)
                echo "Detected target-root kernel headers archive."
                ;;
              header-root)
                echo "Detected complete kernel headers archive rooted at its contents; installer will normalize it to /usr/src/linux-headers-<release>/."
                ;;
              uapi-root)
                echo "::notice::Bundle contains exported UAPI headers only (no kernel Makefile/generated build tree). They will be preserved separately; external kernel-module compilation is not supported by this headers archive."
                ;;
            esac
            CUSTOM_KERNEL_RELEASE="$(dbai_detect_kernel_modules_release "$modules_listing")" || {
              echo "::error::Unable to derive custom kernel release from the validated modules archive."
              exit 2
            }
            echo "Resolved custom kernel release for output naming: $CUSTOM_KERNEL_RELEASE"
            rm -rf "$temp_dir"
          elif [[ "$KERNEL_MODE" == "Recompile Custom Kernel" ]]; then
            CUSTOM_KERNEL_REPO_URL="${KERNEL_CUSTOM_INPUT%%#*}"
            CUSTOM_KERNEL_REPO_REF="main"
            if [[ "$KERNEL_CUSTOM_INPUT" == *#* ]]; then CUSTOM_KERNEL_REPO_REF="${KERNEL_CUSTOM_INPUT#*#}"; fi
            [[ "$CUSTOM_KERNEL_REPO_URL" =~ ^https:// ]] || { echo "::error::Recompile Custom Kernel needs an HTTPS Git URL, optionally followed by #branch:<name> or #tag:<name>."; exit 2; }
            [[ "$CUSTOM_KERNEL_REPO_REF" =~ ^(branch:|tag:)?[A-Za-z0-9._/-]+$ ]] || { echo "::error::Custom kernel repo ref must be a branch name or tag (optionally prefixed with branch: or tag:)."; exit 2; }
          fi

          IFS=',' read -r -a releases <<< "$RELEASES_INPUT"
          IFS=',' read -r -a profiles <<< "$PROFILES_INPUT"
          filesystems=()
          case "$FILESYSTEM_INPUT" in
            both) filesystems=(ext4 btrfs) ;;
            ext4|btrfs) filesystems=("$FILESYSTEM_INPUT") ;;
          esac
          matrix='{"include":[]}'
          for release in "${releases[@]}"; do
            release="$(xargs <<< "$release")"
            for profile in "${profiles[@]}"; do
              profile="$(xargs <<< "$profile")"
              app_candidates=("none")
              desktop_candidates=("none")
              if [[ "$profile" == "application" ]]; then
                if ! app_candidates_text="$(bash scripts/resolve-app-variants.sh "$APP_PROFILE" "$release")"; then
                  echo "::error::Could not resolve application '$APP_PROFILE' for release '$release'."
                  exit 2
                fi
                if [[ -z "$app_candidates_text" ]]; then
                  echo "::notice::Skipping Application image for '$release': no selected app is compatible with this release."
                  continue
                fi
                mapfile -t app_candidates <<< "$app_candidates_text"
              elif [[ "$profile" == "desktop" ]]; then
                if ! desktop_candidates_text="$(bash scripts/resolve-desktop-environments.sh "$DESKTOP_ENVIRONMENT_INPUT" "$release")"; then
                  echo "::error::Could not resolve desktop environment selection '$DESKTOP_ENVIRONMENT_INPUT' for release '$release'."
                  exit 2
                fi
                if [[ -z "$desktop_candidates_text" ]]; then
                  echo "::notice::Skipping Desktop image for '$release': no selected desktop environment is available for ARM64."
                  continue
                fi
                mapfile -t desktop_candidates <<< "$desktop_candidates_text"
              fi
              for app_variant in "${app_candidates[@]}"; do
                for desktop_environment in "${desktop_candidates[@]}"; do
                  for fs in "${filesystems[@]}"; do
                    matrix="$(jq -c --arg release "$release" --arg profile "$profile" --arg filesystem "$fs" --arg app_variant "$app_variant" --arg desktop_environment "$desktop_environment" '.include += [{release:$release,profile:$profile,filesystem:$filesystem,app_variant:$app_variant,desktop_environment:$desktop_environment}]' <<< "$matrix")"
                  done
                done
              done
            done
          done
          planned_count="$(jq '.include | length' <<< "$matrix")"
          if (( planned_count > 256 )); then
            echo "::error::Plan expands to $planned_count matrix jobs; GitHub Actions supports at most 256. Choose fewer OS releases, filesystems, or Desktop environments."
            exit 2
          fi
          if (( planned_count == 0 )); then
            echo "::error::No build combinations remain. Check selected image types, OS releases, desktop environment, and application compatibility."
            exit 2
          fi
          {
            echo "matrix=$matrix"
            echo "board=$BOARD"
            echo "releases=$RELEASES_INPUT"
            echo "profiles=$PROFILES_INPUT"
            echo "custom_kernel_release=$CUSTOM_KERNEL_RELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved board: $BOARD"
          echo "Planned combinations: $planned_count"
          jq . <<< "$matrix"

  build:
    name: ${{ matrix.release }} / ${{ matrix.profile }} / ${{ matrix.app_variant }} / ${{ matrix.desktop_environment }} / ${{ matrix.filesystem }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BOARD: ${{ needs.plan.outputs.board }}
      RELEASE: ${{ matrix.release }}
      PROFILE: ${{ matrix.profile }}
      FILESYSTEM: ${{ matrix.filesystem }}
      SOURCE_REF: ${{ inputs.source_ref || 'main' }}
      KERNEL_MODE: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[dbai-smoke]') || contains(github.event.head_commit.message, '[dbai-smoke-desktop]') || contains(github.event.head_commit.message, '[dbai-smoke-app]'))) && 'Custom Kernel' || inputs.kernel_mode || 'Kernel Official' }}
      APP_PROFILE: ${{ inputs.app_profile || 'none' }}
      APP_VARIANT: ${{ matrix.app_variant }}
      DESKTOP_ENVIRONMENT: ${{ matrix.desktop_environment || 'none' }}
      DESKTOP_TIER: ${{ inputs.desktop_tier || 'mid' }}
      KERNEL_CUSTOM_INPUT: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[dbai-smoke]') || contains(github.event.head_commit.message, '[dbai-smoke-desktop]') || contains(github.event.head_commit.message, '[dbai-smoke-app]'))) && 'https://github.com/armarchindo/kernel/releases/download/kernel_dbai/6.1.66-DBAI.tar.gz' || inputs.kernel_custom_input || '' }}
      CUSTOM_KERNEL_RELEASE: ${{ needs.plan.outputs.custom_kernel_release }}
      KERNEL_PATCH_SERIES: meson64-current
    steps:
      - name: Report runner resources before disk setup
        shell: bash
        run: |
          echo "Runner: $(uname -a)"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "=== Filesystems before disk setup ==="
          df -hT / /mnt "$GITHUB_WORKSPACE" || true
          lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS || true
          echo "=== Memory and swap ==="
          free -h
          swapon --show || true

      - name: Maximize available build disk
        uses: easimon/maximize-build-space@v10
        timeout-minutes: 10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Move Docker storage to large build volume
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker_root="$GITHUB_WORKSPACE/.docker-data"
          exclude_file="$GITHUB_WORKSPACE/.git/info/exclude"
          grep -qxF '/.docker-data/' "$exclude_file" || printf '\n/.docker-data/\n' >> "$exclude_file"
          sudo systemctl stop docker.socket docker.service || true
          sudo mkdir -p "$docker_root"
          sudo chown root:root "$docker_root"
          sudo python3 - "$docker_root" <<'PY'
          import json, os, sys
          path = "/etc/docker/daemon.json"
          try:
              with open(path, encoding="utf-8") as f:
                  config = json.load(f)
          except FileNotFoundError:
              config = {}
          config["data-root"] = sys.argv[1]
          tmp = path + ".tmp"
          with open(tmp, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          os.replace(tmp, path)
          PY
          sudo systemctl start docker
          for _ in {1..30}; do
            if docker info >/dev/null 2>&1; then break; fi
            sleep 2
          done
          actual_root="$(docker info --format '{{.DockerRootDir}}')"
          echo "DockerRootDir=$actual_root"
          [[ "$actual_root" == "$docker_root" ]] || { echo "::error::Docker did not switch to the large workspace volume."; exit 1; }
          df -h "$docker_root" "$GITHUB_WORKSPACE"
          available_gb="$(df -BG --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -dc '0-9')"
          (( available_gb >= 35 )) || { echo "::error::Only ${available_gb} GB free in build workspace; at least 35 GB is required."; exit 1; }

      - name: Register ARM64 QEMU binfmt on runner host
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Armbian builds ARM root filesystems inside Docker. Register QEMU on
          # the runner host first; enabling binfmt only inside the build container
          # fails because that container cannot update the host kernel registry.
          docker run --privileged --rm tonistiigi/binfmt:latest --install arm64
          if ! sudo test -r /proc/sys/fs/binfmt_misc/qemu-aarch64; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc || true
          fi
          if ! sudo test -r /proc/sys/fs/binfmt_misc/qemu-aarch64; then
            echo "::error::QEMU ARM64 binfmt registration did not create qemu-aarch64 on the runner host."
            exit 1
          fi
          sudo cat /proc/sys/fs/binfmt_misc/qemu-aarch64
          sudo grep -q '^enabled' /proc/sys/fs/binfmt_misc/qemu-aarch64 || {
            echo "::error::QEMU ARM64 binfmt exists but is not enabled."
            exit 1
          }

      - name: Resolve source and verify board ID
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BOARD" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid board ID"; exit 2; }
          # SOURCE_REF is supplied by the job-level environment.
          # shellcheck disable=SC2153
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::source_ref contains unsupported characters"; exit 2; }

          # Prefer the official Armbian framework so Kernel Official can match
          # the public Armbian OCI artifact cache. The DBAI fork changes framework
          # hashes and can force a cache miss even when the kernel inputs are identical.
          SOURCE_REPO="armbian/build"

          clone_source() {
            local repo="$1"
            rm -rf armbian-source
            git clone --filter=blob:none --no-checkout "https://github.com/$repo.git" armbian-source
            git -C armbian-source fetch --depth=1 origin "$SOURCE_REF"
            git -C armbian-source checkout --detach FETCH_HEAD
          }

          clone_source "$SOURCE_REPO"
          if ! find armbian-source/config/boards -maxdepth 1 -type f -name "$BOARD.*" -print -quit | grep -q .; then
            echo "Board '$BOARD' not found in official Armbian source; trying DBAI fork."
            SOURCE_REPO="enterdvoid/build"
            clone_source "$SOURCE_REPO"
          fi
          if ! find armbian-source/config/boards -maxdepth 1 -type f -name "$BOARD.*" -print -quit | grep -q .; then
            echo "::error::Board '$BOARD' was not found as config/boards/$BOARD.* in source $SOURCE_REPO at ref $SOURCE_REF."
            echo "Check the exact board ID and source ref. Custom input is not a promise of support by either source."
            exit 2
          fi

          SOURCE_SHA="$(git -C armbian-source rev-parse HEAD)"
          {
            echo "repo=$SOURCE_REPO"
            echo "sha=$SOURCE_SHA"
            echo "source_ref=$SOURCE_REF"
          } >> "$GITHUB_OUTPUT"
          echo "Using $SOURCE_REPO@$SOURCE_SHA for $BOARD"

      - name: Add DBAI build extensions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p armbian-source/userpatches/extensions
          cp extensions/dbai-casaos.sh armbian-source/userpatches/extensions/
          cp extensions/dbai-apps.sh armbian-source/userpatches/extensions/
          cp extensions/dbai-custom-kernel.sh armbian-source/userpatches/extensions/
          # Custom module bundles are staged and normalized before entering the firmware rootfs.
          cp extensions/dbai-custom-bootfs.sh armbian-source/userpatches/extensions/
          cp extensions/dbai-openbox.sh armbian-source/userpatches/extensions/
          cp extensions/dbai-branding.sh armbian-source/userpatches/extensions/
          mkdir -p armbian-source/userpatches/tools
          cp scripts/patch-armbian-motd.py scripts/dbai-apps.sh armbian-source/userpatches/tools/
          if [[ "$KERNEL_MODE" == "Custom Kernel" || "$KERNEL_MODE" == "Recompile Custom Kernel" ]]; then
            mkdir -p armbian-source/userpatches/platform
            cp "$GITHUB_WORKSPACE/platform/bootfs_custom_kernel.tar.gz" armbian-source/userpatches/platform/
          fi
          if [[ "$KERNEL_MODE" == "Recompile Kernel Official" || "$KERNEL_MODE" == "Recompile Custom Kernel" ]]; then
            mkdir -p "armbian-source/userpatches/kernel/archive/$KERNEL_PATCH_SERIES"
            shopt -s nullglob
            patch_files=("$GITHUB_WORKSPACE/kernel-patches/$KERNEL_PATCH_SERIES"/*.patch)
            if (("${#patch_files[@]}" > 0)); then
              cp "${patch_files[@]}" "armbian-source/userpatches/kernel/archive/$KERNEL_PATCH_SERIES/"
              echo "Installed ${#patch_files[@]} kernel patch(es) for explicit recompile mode from kernel-patches/$KERNEL_PATCH_SERIES"
            else
              echo "No optional kernel patches found in kernel-patches/$KERNEL_PATCH_SERIES"
            fi
          else
            echo "Skipping DBAI user kernel patches in $KERNEL_MODE to preserve official artifact-cache compatibility."
          fi
          mkdir -p armbian-source/extensions armbian-source/tools
          cp extensions/proxmox-official.sh armbian-source/extensions/
          cp extensions/proxmox-community.sh armbian-source/extensions/
          # Both Proxmox profiles patch the installed Armbian first-login selector after package install.
          cp extensions/dbai-proxmox-firstlogin-fix.sh armbian-source/extensions/
          cp tools/dbai-vm-import armbian-source/tools/
          # Kernel Official may consume Armbian's prebuilt OCI artifact, but must never silently fall back to source compilation.
          python3 "$GITHUB_WORKSPACE/scripts/guard-kernel-cache-only.py" "$GITHUB_WORKSPACE/armbian-source/lib/functions/artifacts/artifact-kernel.sh" "$KERNEL_MODE"
          # The board config is loaded after CLI parameters, so its BOOTSIZE="512" overrides
          # the requested BOOTSIZE=256. Set the board's authoritative value to 256 MiB.
          if [[ "$BOARD" == "aml-s9xx-box" ]]; then
            python3 - "$GITHUB_WORKSPACE/armbian-source/config/boards" <<'PY'
          import pathlib, re, sys
          board_dir = pathlib.Path(sys.argv[1])
          candidates = sorted(board_dir.glob("aml-s9xx-box.*"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one aml-s9xx-box board config, found {len(candidates)}")
          p = candidates[0]
          content = p.read_text(encoding="utf-8")
          pattern = re.compile(r"(?m)^BOOTSIZE\s*=.*$")
          matches = list(pattern.finditer(content))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one BOOTSIZE assignment in {p}, found {len(matches)}")
          old_line = matches[0].group(0)
          if old_line.strip() != 'BOOTSIZE="256"':
              content = pattern.sub('BOOTSIZE="256"', content, count=1)
              p.write_text(content, encoding="utf-8")
          print(f"Enforced {p.name}: BOOTSIZE=256 MiB")
          PY
            python3 - "$GITHUB_WORKSPACE/armbian-source/lib/functions/image/partitioning.sh" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          old_type = '\t\t\t\t\t[[ "$IMAGE_PARTITION_TABLE" != "gpt" ]] && local type="ea" || local type="BC13C2FF-59E6-4262-A352-B275FD6F7172"'
          new_type = '''\t\t\t\t\tif [[ "$IMAGE_PARTITION_TABLE" != "gpt" ]]; then
          \t\t\t\t\t\tif [[ "$BOARD" == "aml-s9xx-box" && "$bootfs" == "fat" ]]; then
          \t\t\t\t\t\t\tlocal type="0c"
          \t\t\t\t\t\telse
          \t\t\t\t\t\t\tlocal type="ea"
          \t\t\t\t\t\tfi
          \t\t\t\t\telse
          \t\t\t\t\t\tlocal type="BC13C2FF-59E6-4262-A352-B275FD6F7172"
          \t\t\t\t\tfi'''
          if old_type in s:
              s = s.replace(old_type, new_type, 1)
          elif 'local type="0c"' not in s:
              raise SystemExit("Could not find Armbian MBR boot partition type line")
          old_mkfs = '\t\trun_host_command_logged "mkfs.${mkfs[$bootfs]}" ${mkopts[$bootfs]} ${mkopts_label[$bootfs]:+${mkopts_label[$bootfs]}"$BOOT_FS_LABEL"} "${LOOP}p${bootpart}"'
          new_mkfs = '''\t\tif [[ "$BOARD" == "aml-s9xx-box" && "$bootfs" == "fat" ]]; then
          \t\t\trun_host_command_logged "mkfs.${mkfs[$bootfs]}" -F32 ${mkopts_label[$bootfs]:+${mkopts_label[$bootfs]}"$BOOT_FS_LABEL"} "${LOOP}p${bootpart}"
          \t\telse
          \t\t\trun_host_command_logged "mkfs.${mkfs[$bootfs]}" ${mkopts[$bootfs]} ${mkopts_label[$bootfs]:+${mkopts_label[$bootfs]}"$BOOT_FS_LABEL"} "${LOOP}p${bootpart}"
          \t\tfi'''
          if old_mkfs in s:
              s = s.replace(old_mkfs, new_mkfs, 1)
          elif '-F32' not in s[s.find('display_alert "Creating /boot"'):s.find("##\\n\\t## EFI PARTITION")]:
              raise SystemExit("Could not find Armbian /boot mkfs line")
          p.write_text(s, encoding="utf-8")
          print("Applied aml-s9xx-box FAT32 and MBR type 0x0C patch.")
          PY
          fi

      - name: Report runner resources before firmware build
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/report-runner-resources.sh" "before-build"

      - name: Build firmware image
        shell: bash
        env:
          SOURCE_REPO: ${{ steps.source.outputs.repo }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          # Debian package maintainer scripts may run without a TTY in GitHub Actions.
          # Keep a deterministic terminal size; Bullseye packages can fail when these are empty.
          export COLUMNS=80
          export LINES=24
          cd armbian-source

          BUILD_MINIMAL=no
          BUILD_DESKTOP=no
          IMAGE_SIZE=4096
          DESKTOP_ENVIRONMENT_ARG=()
          DESKTOP_TIER_ARG=()
          DESKTOP_OPENBOX=no
          case "$PROFILE" in
            minimal) BUILD_MINIMAL=yes; IMAGE_SIZE=4096 ;;
            server) BUILD_MINIMAL=no; IMAGE_SIZE=4096 ;;
            application) BUILD_MINIMAL=no; IMAGE_SIZE=8192 ;;
            desktop)
              IMAGE_SIZE=8192
              if [[ "$DESKTOP_ENVIRONMENT" == "openbox" ]]; then
                # Start from Armbian Minimal, then add only the standalone Openbox GUI session.
                # This avoids both the interactive DE dialog and the heavier Server base.
                BUILD_MINIMAL=yes
                BUILD_DESKTOP=no
                DESKTOP_OPENBOX=yes
              else
                BUILD_MINIMAL=no
                BUILD_DESKTOP=yes
                DESKTOP_ENVIRONMENT_ARG=("DESKTOP_ENVIRONMENT=$DESKTOP_ENVIRONMENT")
                DESKTOP_TIER_ARG=("DESKTOP_TIER=$DESKTOP_TIER")
              fi
              echo "Desktop environment selected non-interactively: $DESKTOP_ENVIRONMENT (tier: $DESKTOP_TIER)"
              ;;
            *) echo "::error::Unknown profile $PROFILE"; exit 2 ;;
          esac

          EXTENSIONS=(dbai-branding)
          if [[ "$DESKTOP_OPENBOX" == "yes" ]]; then
            EXTENSIONS+=(dbai-openbox)
          fi
          BUILD_KERNEL_MODE="$KERNEL_MODE"
          APP_PROFILE_EFFECTIVE="none"
          ARTIFACT_IGNORE_CACHE=no
          if [[ "$BUILD_KERNEL_MODE" == "Recompile Kernel Official" || "$BUILD_KERNEL_MODE" == "Recompile Custom Kernel" ]]; then ARTIFACT_IGNORE_CACHE=yes; fi
          BSPFREEZE_ARG=()
          if [[ "$PROFILE" == "application" ]]; then
            APP_PROFILE_EFFECTIVE="$APP_VARIANT"
            case "$APP_VARIANT" in
              proxmox-official)
                [[ "$RELEASE" == "trixie" ]] || { echo "::error::Proxmox Official application variant only supports Trixie."; exit 2; }
                EXTENSIONS+=(proxmox-official); BSPFREEZE_ARG=(BSPFREEZE=yes) ;;
              proxmox-community)
                [[ "$RELEASE" == "bookworm" ]] || { echo "::error::Proxmox Community application variant only supports Bookworm."; exit 2; }
                EXTENSIONS+=(proxmox-community); BSPFREEZE_ARG=(BSPFREEZE=yes) ;;
              homeassistant) EXTENSIONS+=(applications-ha) ;;
              openmediavault) EXTENSIONS+=(applications-omv) ;;
              casaos) EXTENSIONS+=(dbai-casaos) ;;
              hermes-9router|lightnvr-go2rtc|hermes-9router-lightnvr) EXTENSIONS+=(dbai-apps) ;;
              none) : ;;
              *) echo "::error::Unsupported application variant $APP_VARIANT"; exit 2 ;;
            esac
          fi
          KERNELSOURCE_ARG=()
          KERNELBRANCH_ARG=()
          if [[ "$BUILD_KERNEL_MODE" == "Custom Kernel" ]]; then
            export DBAI_KERNEL_BUNDLE_URL="$KERNEL_CUSTOM_INPUT"
            EXTENSIONS+=(dbai-custom-kernel dbai-custom-bootfs)
            export DBAI_KERNEL_MODE="Custom Kernel"
          elif [[ "$BUILD_KERNEL_MODE" == "Recompile Custom Kernel" ]]; then
            CUSTOM_KERNEL_REPO_URL="${KERNEL_CUSTOM_INPUT%%#*}"
            CUSTOM_KERNEL_REPO_REF="main"
            if [[ "$KERNEL_CUSTOM_INPUT" == *#* ]]; then CUSTOM_KERNEL_REPO_REF="${KERNEL_CUSTOM_INPUT#*#}"; fi
            KERNELSOURCE_ARG=("KERNELSOURCE=$CUSTOM_KERNEL_REPO_URL")
            if [[ "$CUSTOM_KERNEL_REPO_REF" == branch:* || "$CUSTOM_KERNEL_REPO_REF" == tag:* ]]; then KERNELBRANCH_ARG=("KERNELBRANCH=$CUSTOM_KERNEL_REPO_REF"); else KERNELBRANCH_ARG=("KERNELBRANCH=branch:$CUSTOM_KERNEL_REPO_REF"); fi
            EXTENSIONS+=(dbai-custom-bootfs)
            export DBAI_KERNEL_MODE="Recompile Custom Kernel"
          else
            export DBAI_KERNEL_MODE="$BUILD_KERNEL_MODE"
          fi

          export DBAI_APP_PROFILE="$APP_PROFILE_EFFECTIVE"
          ENABLE_EXTENSIONS="$(IFS=,; echo "${EXTENSIONS[*]}")"
          echo "Board=$BOARD Release=$RELEASE Profile=$PROFILE Filesystem=$FILESYSTEM Kernel=$BUILD_KERNEL_MODE App=$APP_PROFILE_EFFECTIVE"
          echo "Extensions=$ENABLE_EXTENSIONS"
          # aml-s9xx-box requires an actual FAT32 /boot filesystem and FAT32-LBA MBR type (0x0C),
          # not Armbian's default ext4 /boot or XBOOTLDR type 0xEA.
          EXPECTED_BOOT_PARTITION_MIB=0
          if [[ "$BOARD" == "aml-s9xx-box" ]]; then
            export BOOTFS_TYPE=fat
            EXPECTED_BOOT_PARTITION_MIB=256
          fi
          DBAI_KERNEL_BUNDLE_ARG=()
          if [[ "$BUILD_KERNEL_MODE" == "Custom Kernel" ]]; then
            DBAI_KERNEL_BUNDLE_ARG=("DBAI_KERNEL_BUNDLE_URL=$KERNEL_CUSTOM_INPUT")
          fi

          # The special smoke commit exists only to validate the custom-kernel
          # image verifier. If the Armbian APT redirector is degraded, use the
          # upstream-supported SKIP_ARMBIAN_REPO switch for this smoke build
          # only; regular user-triggered and production builds keep the repo.
          ARMBIAN_REPO_ARG=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] && git -C "$GITHUB_WORKSPACE" log -1 --format=%s | grep -Eq '\[dbai-smoke(-desktop|-app)?\]'; then
            ARMBIAN_REPO_ARG=("SKIP_ARMBIAN_REPO=yes")
            echo "Smoke build: skipping the Armbian APT repository after apt.armbian.com connectivity failures."
          fi

          ./compile.sh build BOARD="$BOARD" BRANCH=current RELEASE="$RELEASE" BUILD_MINIMAL="$BUILD_MINIMAL" BUILD_DESKTOP="$BUILD_DESKTOP" REVISION="$DBAI_IMAGE_VERSION" IMAGE_VERSION="$DBAI_IMAGE_VERSION" ROOTFS_TYPE="$FILESYSTEM" FIXED_IMAGE_SIZE="$IMAGE_SIZE" BOOTSIZE=256 COMPRESS_OUTPUTIMAGE=sha,xz IMAGE_XZ_COMPRESSION_RATIO=0 KERNEL_CONFIGURE=no ARTIFACT_IGNORE_CACHE="$ARTIFACT_IGNORE_CACHE" ENABLE_EXTENSIONS="$ENABLE_EXTENSIONS" "DBAI_KERNEL_MODE=$BUILD_KERNEL_MODE" \
            "${DESKTOP_ENVIRONMENT_ARG[@]}" "${DESKTOP_TIER_ARG[@]}" "${DBAI_KERNEL_BUNDLE_ARG[@]}" "${KERNELSOURCE_ARG[@]}" "${KERNELBRANCH_ARG[@]}" "${BSPFREEZE_ARG[@]}" "${ARMBIAN_REPO_ARG[@]}"

          mkdir -p "$GITHUB_WORKSPACE/stage"
          shopt -s nullglob
          images=(output/images/*.img output/images/*.img.xz output/images/*.img.gz output/images/*.img.zst)
          (("${#images[@]}" > 0)) || { echo "::error::No image file found under output/images"; exit 1; }
          case "$PROFILE" in
            application) PROFILE_VARIANT="$APP_PROFILE_EFFECTIVE" ;;
            *) PROFILE_VARIANT="$PROFILE" ;;
          esac
          SHORT_BOARD="${BOARD%-box}"
          for image in "${images[@]}"; do
            base="$(basename "$image")"
            # Armbian output may omit the profile suffix (e.g. *_6.18.57.img.xz).
            # Accept both profile-suffixed and unsuffixed image names.
            if [[ "$base" =~ ^Armbian(-unofficial)?_([^_]+)_([^_]+)_([^_]+)_([^_]+)_(.+)\.img(\.(xz|gz|zst))?$ ]]; then
              armbian_version="${BASH_REMATCH[2]}"
              image_board="${BASH_REMATCH[3]}"
              image_release="${BASH_REMATCH[4]}"
              image_tail="${BASH_REMATCH[6]}"
              # Desktop environments and extension suffixes can add underscore-separated fields.
              # Custom Kernel mode replaces this fallback with the release from the verified bundle.
              kernel_version="${image_tail%%_*}"
            else
              echo "::error::Cannot parse Armbian image filename: $base"
              exit 1
            fi

            [[ "$image_release" == "$RELEASE" ]] || {
              echo "::error::Image release in '$base' is '$image_release', expected '$RELEASE'."
              exit 1
            }
            [[ "${image_board,,}" == "${BOARD,,}" ]] || {
              echo "::error::Image board in '$base' is '$image_board', expected '$BOARD'."
              exit 1
            }

            armbian_version_filename="${armbian_version%-trunk}"
            case "$base" in
              *.img.xz) suffix=".img.xz" ;;
              *.img.gz) suffix=".img.gz" ;;
              *.img.zst) suffix=".img.zst" ;;
              *.img) suffix=".img" ;;
              *) echo "::error::Unrecognized image format: $base"; exit 1 ;;
            esac

            # Include the selected DE in Desktop asset names so an "all" run cannot overwrite sibling DEs.
            asset_profile="$PROFILE_VARIANT"
            if [[ "$PROFILE" == "desktop" ]]; then
              asset_profile="desktop-$DESKTOP_ENVIRONMENT"
            fi
            asset_kernel_version="$kernel_version"
            if [[ "$BUILD_KERNEL_MODE" == "Custom Kernel" ]]; then
              [[ "$CUSTOM_KERNEL_RELEASE" =~ ^[A-Za-z0-9._+-]+$ ]] || {
                echo "::error::Custom Kernel image naming requires a validated module release from the bundle."
                exit 1
              }
              asset_kernel_version="$CUSTOM_KERNEL_RELEASE"
            elif [[ "$PROFILE" == "application" ]]; then
              # Armbian extensions can append the app name to the kernel field in the output filename.
              app_suffix="-${PROFILE_VARIANT}"
              asset_kernel_version="${asset_kernel_version%"$app_suffix"}"
            fi
            # Openbox's extension adds its own upstream filename suffix; keep the canonical DBAI name clean.
            if [[ "$PROFILE" == "desktop" && "$DESKTOP_ENVIRONMENT" == "openbox" ]]; then
              asset_kernel_version="${asset_kernel_version%-openbox}"
            fi
            safe_base="DBAI2K26-Armbian_${armbian_version_filename}-${SHORT_BOARD}-${RELEASE}-k${asset_kernel_version}-${asset_profile}-${FILESYSTEM}${suffix}"
            stage_image="$GITHUB_WORKSPACE/stage/$safe_base"
            cp "$image" "$stage_image"

            # For Custom Kernel, inspect the finished disk image itself before
            # uploading it. Verify dpkg has no distro kernel packages, the custom
            # kernel hash matches, no legacy versioned /boot files remain, and the
            # generated custom initramfs plus U-Boot ramdisk match their SHA-256 values.
            if [[ "$BUILD_KERNEL_MODE" == "Custom Kernel" ]]; then
              echo "Read-only verification of staged custom-kernel image: $safe_base (timeout: 300 seconds)"
              echo "Expected persistent manifest: /etc/dbai-custom-kernel-manifest.txt"
              timeout 300s bash "$GITHUB_WORKSPACE/scripts/verify-custom-kernel-image.sh" "$stage_image" "$CUSTOM_KERNEL_RELEASE" "$IMAGE_SIZE" "$EXPECTED_BOOT_PARTITION_MIB"
              echo "Custom-kernel image verification passed: $safe_base"
            fi

            image_size="$(stat -c '%s' "$stage_image")"
            if (( image_size > 1900000000 )); then
              echo "::error::Asset $safe_base is larger than 1.9 GB; split/compress it before publishing to GitHub Releases."
              exit 1
            fi
            image_sha="$(sha256sum "$stage_image" | awk '{print $1}')"
            echo "Staged image: $safe_base (Armbian $armbian_version; kernel release $asset_kernel_version; SHA-256 $image_sha)"
          done

      - name: Report runner resources after firmware build
        if: always()
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/report-runner-resources.sh" "after-build"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbai-${{ matrix.release }}-${{ matrix.profile }}-${{ matrix.app_variant }}-${{ matrix.desktop_environment }}-${{ matrix.filesystem }}
          path: stage/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Verify and publish firmware release
    needs: [plan, build]
    # Smoke builds validate final-image cleanup, not publication of images
    # assembled with the temporary SKIP_ARMBIAN_REPO workaround.
    if: ${{ needs.build.result == 'success' && !((github.event_name == 'push') && (contains(github.event.head_commit.message, '[dbai-smoke]') || contains(github.event.head_commit.message, '[dbai-smoke-desktop]') || contains(github.event.head_commit.message, '[dbai-smoke-app]'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BOARD: ${{ needs.plan.outputs.board }}
      RELEASES_INPUT: ${{ needs.plan.outputs.releases }}
      PROFILES_INPUT: ${{ needs.plan.outputs.profiles }}
      FILESYSTEM_INPUT: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[dbai-smoke]') || contains(github.event.head_commit.message, '[dbai-smoke-desktop]') || contains(github.event.head_commit.message, '[dbai-smoke-app]'))) && 'ext4' || inputs.filesystem || 'ext4' }}
      KERNEL_MODE: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[dbai-smoke]') || contains(github.event.head_commit.message, '[dbai-smoke-desktop]') || contains(github.event.head_commit.message, '[dbai-smoke-app]'))) && 'Custom Kernel' || inputs.kernel_mode || 'Kernel Official' }}
      SOURCE_REF: ${{ inputs.source_ref || 'main' }}
      APP_PROFILE: ${{ inputs.build_application && inputs.app_profile || 'none' }}
      DELETE_OLD: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[dbai-smoke]') || contains(github.event.head_commit.message, '[dbai-smoke-desktop]') || contains(github.event.head_commit.message, '[dbai-smoke-app]')) && 'false' || 'true' }}
    steps:
      - name: Report release assembly runner resources
        shell: bash
        run: |
          echo "Runner: $(uname -a)"
          df -hT / /mnt "$GITHUB_WORKSPACE" || true
          free -h

      - name: Maximize release assembly disk
        uses: easimon/maximize-build-space@v10
        timeout-minutes: 10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dbai-*
          path: dist
          merge-multiple: true

      - name: Verify assets and prepare checksums
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::GitHub Actions token is unavailable. Check workflow permissions and repository Actions settings."
            exit 1
          fi
          shopt -s nullglob
          files=(dist/*)
          (("${#files[@]}" > 0)) || { echo "::error::No build artifacts were downloaded"; exit 1; }
          (cd dist && sha256sum -- * > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)

          NOTES_FILE="$RUNNER_TEMP/DBAI-RELEASE-NOTES.md"
          {
            echo "# DBAI Unified Firmware Builder"
            echo
            echo "Firmware images built with the Armbian build framework."
            echo
            echo "## Build batch"
            echo
            echo "- **Board:** $BOARD"
            echo "- **Requested OS releases:** $RELEASES_INPUT"
            echo "- **Image profiles:** $PROFILES_INPUT"
            echo "- **Filesystem selection:** $FILESYSTEM_INPUT"
            echo "- **Application profile:** $APP_PROFILE"
            echo "- **Kernel mode:** $KERNEL_MODE"
            echo "- **Armbian source ref:** $SOURCE_REF"
            echo "- **Builder commit:** $GITHUB_SHA"
            echo "- **Workflow run:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "## Firmware assets"
            echo
            echo "The image filenames encode the Armbian image version, OS release, kernel version, image profile, and filesystem."
            echo
            shopt -s nullglob
            found_image=false
            for asset in dist/DBAI2K26-Armbian_*; do
              case "$asset" in
                *.img|*.img.xz|*.img.gz|*.img.zst)
                  found_image=true
                  name="$(basename "$asset")"
                  size="$(stat -c '%s' "$asset")"
                  echo "- \`$name\` — $size bytes"
                  ;;
              esac
            done
            [[ "$found_image" == true ]] || { echo "::error::No versioned DBAI Armbian image assets were found."; exit 1; }
            echo
            echo "## Integrity"
            echo
            echo "- SHA256SUMS contains SHA-256 checksums for every uploaded firmware image."
            echo "- Verify downloads with: \`sha256sum -c SHA256SUMS\`"
            echo
            echo "## Notes"
            echo
            echo "- In Custom Kernel mode, the filename kernel release comes from the modules archive installed into the image; other modes use the kernel field from the Armbian output filename."
            echo "- Test on target hardware before production use."
          } > "$NOTES_FILE"

          TAG="dbai-build-$(date -u +'%Y%m%d-%H%M%S')-$GITHUB_RUN_ID"
          PROFILE_TITLE="$(printf '%s' "$PROFILES_INPUT" | tr ',' ' ' | sed -E 's/(^| )minimal( |$)/\1Minimal\2/g; s/(^| )server( |$)/\1Server\2/g; s/(^| )application( |$)/\1Application\2/g; s/(^| )desktop( |$)/\1Desktop\2/g' | xargs)"
          TITLE="DBAI Armbian ${PROFILE_TITLE} Build $(date -u +'%Y-%m-%d_%H-%M')"
          {
            echo "tag=$TAG"
            echo "title=$TITLE"
            echo "notes_file=$NOTES_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release and verify remote assets
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: |
          set -euo pipefail
          # RUNNER_TEMP can live on the runner's small root filesystem. Store remote verification
          # downloads in the workspace, which is mounted on the expanded build volume.
          CHECK_DIR="$GITHUB_WORKSPACE/.dbai-release-check-$GITHUB_RUN_ID"
          cleanup_partial_release() {
            status=$?
            if [[ $status -ne 0 ]]; then
              echo "::error::Release failed verification; removing partial release/tag."
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
              git push origin ":refs/tags/$TAG" || true
            fi
            rm -rf -- "$CHECK_DIR" || true
            exit "$status"
          }
          trap cleanup_partial_release EXIT

          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TITLE" --prerelease --notes-file "$NOTES_FILE"

          mkdir -p "$CHECK_DIR"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$CHECK_DIR"
          while IFS=' ' read -r expected filename; do
            [[ -n "$filename" ]] || continue
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$filename" --dir "$CHECK_DIR"
            printf '%s  %s\n' "$expected" "$filename" | (cd "$CHECK_DIR" && sha256sum -c -)
            rm -f "$CHECK_DIR/$filename"
          done < "$CHECK_DIR/SHA256SUMS"

          # Keep every previously published release. Only a partially created current release
          # may be removed by cleanup_partial_release if remote asset verification fails.
          echo "Verified release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          rm -rf -- "$CHECK_DIR"
          trap - EXIT

# Smoke verification only: skip unavailable Armbian APT repo and do not publish test images.
