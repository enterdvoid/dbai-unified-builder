name: DBAI Builder Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "extensions/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "docs/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "extensions/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Validate workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh extensions/*.sh tests/*.sh
      - name: Validate Docker Compose app configuration
        run: |
          docker compose version
          awk '/cat >.*docker-compose.yml.*<<.COMPOSE./ {capture=1; next} /^COMPOSE$/ {capture=0} capture {print}' extensions/dbai-apps.sh > "$RUNNER_TEMP/docker-compose.yml"
          cat > "$RUNNER_TEMP/.env" <<'EOF'
          JWT_SECRET=validation-secret
          INITIAL_PASSWORD=validation-password
          API_KEY_SECRET=validation-api-key
          MACHINE_ID_SALT=validation-machine-salt
          EOF
          docker compose --project-directory "$RUNNER_TEMP" --profile hermes-9router --profile lightnvr-go2rtc -f "$RUNNER_TEMP/docker-compose.yml" config --quiet
      - name: Test input, kernel headers, desktop compatibility, and build arguments
        run: |
          bash tests/test-validate-inputs.sh
          bash tests/test-custom-kernel-headers-layout.sh
          bash tests/test-desktop-selection.sh
          bash tests/test-workflow-build-args.sh
      - name: Test custom image verifier disk-space probe
        run: bash tests/test-custom-kernel-image-verifier.sh
      - name: Inspect and test the published DBAI kernel bundle
        run: bash tests/test-custom-kernel-bundle-integration.sh
